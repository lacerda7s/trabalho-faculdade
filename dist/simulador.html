previsão\". */\nexport function drawPrediction(ctx: CanvasRenderingContext2D, cam: Camera, points: Vec2[], complete: boolean): void {\n  if (points.length < 2) return;\n  ctx.save();\n  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';\n  ctx.strokeStyle = 'rgba(33, 37, 41, 0.35)';\n  ctx.lineWidth = 1;\n  let acc = 0;\n  for (let i = 1; i < points.length; i++) {\n    const a = toScreen(cam, points[i - 1]);\n    const b = toScreen(cam, points[i]);\n    acc += Math.hypot(b.x - a.x, b.y - a.y);\n    if (acc >= 9) {\n      acc = 0;\n      ctx.beginPath();\n      ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.stroke();\n    }\n  }\n  const end = toScreen(cam, points[points.length - 1]);\n  if (complete) {\n    ctx.strokeStyle = '#fff';\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.moveTo(end.x - 6, end.y - 6);\n    ctx.lineTo(end.x + 6, end.y + 6);\n    ctx.moveTo(end.x + 6, end.y - 6);\n    ctx.lineTo(end.x - 6, end.y + 6);\n    ctx.stroke();\n  } else {\n    ctx.fillStyle = 'rgba(255,255,255,0.95)';\n    ctx.font = '700 15px Nunito, sans-serif';\n    ctx.textAlign = 'left';\n    ctx.fillText('?', end.x + 6, end.y - 4);\n  }\n  ctx.restore();\n}\n\nexport function drawProjectile(ctx: CanvasRenderingContext2D, cam: Camera, body: Body, spec: ProjectileSpec): void {\n  const p = toScreen(cam, body.position);\n  const r = Math.max(5, body.radius * cam.scale * 1.5);\n  const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r);\n  g.addColorStop(0, '#f8f9fa');\n  g.addColorStop(0.35, spec.color);\n  g.addColorStop(1, '#111');\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);\n  ctx.fill();\n}\n\n/** Seta no topo da tela quando o projétil sobe além da área visível. */\nexport function drawOffscreenMarker(ctx: CanvasRenderingContext2D, cam: Camera, body: Body): void {\n  if (body.position.y <= cam.maxY) return;\n  const x = (body.position.x - cam.minX) * cam.scale;\n  ctx.fillStyle = 'rgba(33, 37, 41, 0.8)';\n  ctx.beginPath();\n  ctx.moveTo(x, 6);\n  ctx.lineTo(x - 8, 20);\n  ctx.lineTo(x + 8, 20);\n  ctx.closePath();\n  ctx.fill();\n  ctx.font = '700 11px \"JetBrains Mono\", monospace';\n  ctx.textAlign = 'center';\n  ctx.fillText(`${body.position.y.toFixed(0)} m`, x, 34);\n}\n", "src/render/SceneRenderer.ts": "/**\n * Renderização da cena completa. Recebe um \"retrato\" do estado (SceneView)\n * e só desenha: nenhuma regra de jogo mora aqui.\n */\nimport type { ForceBreakdown, LevelConfig, ProjectileSpec, Vec2 } from '../core/types';\nimport type { Flight } from '../core/Simulation';\nimport { muzzlePosition, pivotPosition } from '../core/Cannon';\nimport { heightAt } from '../core/Terrain';\nimport { fromAngle, length, scale } from '../core/vector';\nimport { Camera, toScreen } from './Camera';\nimport { drawClouds, drawMountains, drawSky, drawWindFlag } from './Background';\nimport { drawDimension, drawObstacles, drawRecoilLimit, drawRuler, drawTerrain } from './TerrainView';\nimport { drawCannon } from './CannonView';\nimport { drawTarget } from './TargetView';\nimport { drawOffscreenMarker, drawPath, drawPrediction, drawProjectile } from './ProjectileView';\nimport { arrowLength, drawArrow, VECTOR_COLORS } from './Vectors';\nimport { drawParticles, Particle } from './Effects';\n\nexport interface ComparisonTrace {\n  id: number;\n  points: Vec2[];\n  color: string;\n  label: string;\n}\n\nexport interface SceneView {\n  cam: Camera;\n  level: LevelConfig;\n  time: number;\n  windSpeed: number;\n  windVisible: boolean;\n  angleDeg: number;\n  recoilOffset: number;\n  muzzleFlash: number;\n  aiming: boolean;\n  prediction: Vec2[] | null;\n  predictionComplete: boolean;\n  launchSpeed: number;\n  /** forças no instante do lançamento (para os vetores antes do disparo) */\n  launchForces: ForceBreakdown | null;\n  projectileMass: number;\n  flight: Flight | null;\n  projectileSpec: ProjectileSpec;\n  comparisons: ComparisonTrace[];\n  particles: Particle[];\n  showVectors: boolean;\n  /** 0..1 — opacidade das setas de ação e reação */\n  thirdLaw: number;\n  hitFlash: number;\n}\n\nconst PX_PER_MS = 2.4; // px por m/s (velocidade)\nconst PX_PER_MS2 = 4.5; // px por m/s² (aceleração causada por cada força)\n\nfunction drawForceArrows(ctx: CanvasRenderingContext2D, origin: Vec2, forces: ForceBreakdown, mass: number, alpha = 1) {\n  const items: Array<[Vec2, string, string]> = [\n    [forces.gravity, VECTOR_COLORS.gravity, 'g'],\n    [forces.wind, VECTOR_COLORS.wind, 'vento'],\n    [forces.drag, VECTOR_COLORS.drag, 'ar'],\n  ];\n  for (const [f, color, label] of items) {\n    const a = length(f) / mass;\n    drawArrow(ctx, origin, f, arrowLength(a, PX_PER_MS2), color, label, alpha);\n  }\n}\n\nexport function drawScene(ctx: CanvasRenderingContext2D, v: SceneView): void {\n  const { cam, level } = v;\n  const groundY = heightAt(level.terrain, level.cannonX);\n\n  drawSky(ctx, cam);\n  drawMountains(ctx, cam);\n  drawClouds(ctx, cam, v.time, v.windVisible ? v.windSpeed : 0);\n  drawTerrain(ctx, cam, level.terrain);\n\n  if (v.windVisible) {\n    [level.worldWidth * 0.3, level.worldWidth * 0.75].forEach((x) => {\n      drawWindFlag(ctx, cam, { x, y: heightAt(level.terrain, x) }, v.windSpeed, v.time);\n    });\n  }\n\n  drawRuler(ctx, cam, level.cannonX);\n  if (v.aiming) {\n    const muzzle = muzzlePosition(level.cannonX, groundY, v.angleDeg);\n    drawDimension(ctx, cam, muzzle.x, level.target.x, `${(level.target.x - muzzle.x).toFixed(1)} m`);\n  }\n  if (level.constraints.maxRecoil !== undefined) {\n    drawRecoilLimit(ctx, cam, level.cannonX - level.constraints.maxRecoil, groundY);\n  }\n\n  drawObstacles(ctx, cam, level.obstacles, v.flight?.outcome === 'obstacle' ? v.flight.obstacleIndex : -1);\n  drawTarget(ctx, cam, level.target, level.terrain, v.hitFlash);\n\n  v.comparisons.forEach((c) => drawPath(ctx, cam, c.points, c.color, { width: 2.5, alpha: 0.75, dash: [8, 5] }));\n\n  if (v.aiming && v.prediction) drawPrediction(ctx, cam, v.prediction, v.predictionComplete);\n\n  if (v.flight) drawPath(ctx, cam, v.flight.trail, 'rgba(255, 255, 255, 0.85)', { width: 2.5 });\n\n  drawCannon(ctx, cam, {\n    baseX: level.cannonX,\n    groundY,\n    angleDeg: v.angleDeg,\n    recoilOffset: v.recoilOffset,\n    flash: v.muzzleFlash,\n  });\n\n  // vetores antes do disparo\n  if (v.aiming && v.showVectors) {\n    const m = toScreen(cam, muzzlePosition(level.cannonX, groundY, v.angleDeg));\n    if (v.launchForces) drawForceArrows(ctx, m, v.launchForces, v.projectileMass, 0.9);\n    drawArrow(ctx, m, fromAngle(v.angleDeg, 1), arrowLength(v.launchSpeed, PX_PER_MS), VECTOR_COLORS.velocity, 'v₀');\n  }\n\n  // projétil em voo\n  if (v.flight) {\n    const body = v.flight.body;\n    const p = toScreen(cam, body.position);\n    if (v.showVectors && !v.flight.outcome) {\n      drawForceArrows(ctx, p, v.flight.forces, body.mass);\n      drawArrow(ctx, p, body.velocity, arrowLength(length(body.velocity), PX_PER_MS), VECTOR_COLORS.velocity, 'v');\n    }\n    drawProjectile(ctx, cam, body, v.projectileSpec);\n    drawOffscreenMarker(ctx, cam, body);\n  }\n\n  // 3ª lei: ação no projétil, reação no canhão\n  if (v.thirdLaw > 0) {\n    const pivot = toScreen(cam, pivotPosition(level.cannonX, groundY, v.recoilOffset));\n    const muzzle = toScreen(cam, muzzlePosition(level.cannonX, groundY, v.angleDeg, v.recoilOffset));\n    const dir = fromAngle(v.angleDeg, 1);\n    drawArrow(ctx, muzzle, dir, 70, VECTOR_COLORS.action, 'ação', v.thirdLaw);\n    drawArrow(ctx, { x: pivot.x, y: pivot.y }, scale(dir, -1), 70, VECTOR_COLORS.reaction, 'reação', v.thirdLaw);\n  }\n\n  drawParticles(ctx, cam, v.particles);\n}\n", "src/render/TargetView.ts": "/** Desenho do alvo. */\nimport type { TargetSpec, TerrainPoint } from '../core/types';\nimport { heightAt } from '../core/Terrain';\nimport { Camera, toScreen } from './Camera';\n\nconst RING_COLORS = ['#e03131', '#ffffff', '#e03131', '#ffffff', '#fcc419'];\n\nexport function drawTarget(ctx: CanvasRenderingContext2D, cam: Camera, target: TargetSpec, terrain: TerrainPoint[], hitFlash: number): void {\n  const c = toScreen(cam, target);\n  const r = target.radius * cam.scale;\n  const ground = toScreen(cam, { x: target.x, y: heightAt(terrain, target.x) });\n\n  // poste\n  if (ground.y > c.y + r) {\n    ctx.fillStyle = '#5c3a17';\n    ctx.fillRect(c.x - 3, c.y + r * 0.6, 6, ground.y - c.y - r * 0.6);\n  }\n\n  if (hitFlash > 0) {\n    ctx.strokeStyle = `rgba(255, 212, 59, ${hitFlash})`;\n    ctx.lineWidth = 6;\n    ctx.beginPath();\n    ctx.arc(c.x, c.y, r * (1.2 + (1 - hitFlash) * 1.5), 0, Math.PI * 2);\n    ctx.stroke();\n  }\n\n  RING_COLORS.forEach((color, i) => {\n    ctx.fillStyle = color;\n    ctx.beginPath();\n    ctx.arc(c.x, c.y, r * (1 - i / RING_COLORS.length), 0, Math.PI * 2);\n    ctx.fill();\n  });\n  ctx.strokeStyle = '#862e2e';\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.arc(c.x, c.y, r, 0, Math.PI * 2);\n  ctx.stroke();\n}\n", "src/render/TerrainView.ts": "/** Terreno, obstáculos, régua e marcações de engenharia. */\nimport type { Rect, TerrainPoint } from '../core/types';\nimport { heightAt } from '../core/Terrain';\nimport { Camera, toScreen } from './Camera';\n\nexport function drawTerrain(ctx: CanvasRenderingContext2D, cam: Camera, points: TerrainPoint[]): void {\n  const left = { x: cam.minX - 1, y: heightAt(points, cam.minX - 1) };\n  const right = { x: cam.maxX + 1, y: heightAt(points, cam.maxX + 1) };\n  const inner = points.filter((p) => p.x > left.x && p.x < right.x);\n  const path = [left, ...inner, right].map((p) => toScreen(cam, p));\n\n  const g = ctx.createLinearGradient(0, cam.height * 0.5, 0, cam.height);\n  g.addColorStop(0, '#69db7c');\n  g.addColorStop(0.25, '#40c057');\n  g.addColorStop(1, '#8a6a3f');\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.moveTo(path[0].x, cam.height);\n  path.forEach((p) => ctx.lineTo(p.x, p.y));\n  ctx.lineTo(path[path.length - 1].x, cam.height);\n  ctx.closePath();\n  ctx.fill();\n\n  ctx.strokeStyle = '#2b8a3e';\n  ctx.lineWidth = 4;\n  ctx.lineJoin = 'round';\n  ctx.beginPath();\n  path.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));\n  ctx.stroke();\n}\n\nexport function drawObstacles(ctx: CanvasRenderingContext2D, cam: Camera, obstacles: Rect[], hitIndex: number): void {\n  obstacles.forEach((o, i) => {\n    const tl = toScreen(cam, { x: o.x, y: o.y + o.height });\n    const w = o.width * cam.scale;\n    const h = o.height * cam.scale;\n    ctx.fillStyle = i === hitIndex ? '#e8590c' : '#868e96';\n    ctx.fillRect(tl.x, tl.y, w, h);\n    // tijolos\n    ctx.strokeStyle = 'rgba(33, 37, 41, 0.35)';\n    ctx.lineWidth = 1;\n    const brick = Math.max(6, cam.scale * 1);\n    for (let y = tl.y, row = 0; y < tl.y + h; y += brick, row++) {\n      ctx.beginPath();\n      ctx.moveTo(tl.x, y);\n      ctx.lineTo(tl.x + w, y);\n      ctx.stroke();\n      const offset = row % 2 ? brick : 0;\n      for (let x = tl.x + offset; x < tl.x + w; x += brick * 2) {\n        ctx.beginPath();\n        ctx.moveTo(x, y);\n        ctx.lineTo(x, Math.min(y + brick, tl.y + h));\n        ctx.stroke();\n      }\n    }\n    ctx.strokeStyle = '#343a40';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(tl.x, tl.y, w, h);\n    if (o.label) {\n      ctx.fillStyle = '#212529';\n      ctx.font = '600 12px Nunito, sans-serif';\n      ctx.textAlign = 'center';\n      ctx.fillText(o.label, tl.x + w / 2, tl.y - 6);\n    }\n  });\n}\n\n/** Régua no rodapé, com origem no canhão. */\nexport function drawRuler(ctx: CanvasRenderingContext2D, cam: Camera, originX: number): void {\n  const y = cam.height - 16;\n  ctx.fillStyle = 'rgba(255, 249, 219, 0.92)';\n  ctx.fillRect(0, y - 4, cam.width, 20);\n  ctx.strokeStyle = '#5c4813';\n  ctx.fillStyle = '#5c4813';\n  ctx.font = '600 10px \"JetBrains Mono\", monospace';\n  ctx.textAlign = 'center';\n  const step = cam.scale > 12 ? 5 : 10;\n  const start = Math.ceil((cam.minX - originX) / step) * step;\n  for (let m = start; originX + m <= cam.maxX; m += step) {\n    const sx = (originX + m - cam.minX) * cam.scale;\n    const major = m % (step * 2) === 0;\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(sx, y - 4);\n    ctx.lineTo(sx, y + (major ? 6 : 3));\n    ctx.stroke();\n    if (major) ctx.fillText(`${m} m`, sx, y + 14);\n  }\n}\n\n/** Cota (linha de dimensão) entre dois pontos no eixo X. */\nexport function drawDimension(ctx: CanvasRenderingContext2D, cam: Camera, x1: number, x2: number, label: string): void {\n  const a = (x1 - cam.minX) * cam.scale;\n  const b = (x2 - cam.minX) * cam.scale;\n  const y = cam.height - 34;\n  ctx.strokeStyle = 'rgba(33, 37, 41, 0.75)';\n  ctx.fillStyle = 'rgba(33, 37, 41, 0.85)';\n  ctx.lineWidth = 1.2;\n  ctx.setLineDash([4, 3]);\n  ctx.beginPath();\n  ctx.moveTo(a, y);\n  ctx.lineTo(b, y);\n  ctx.stroke();\n  ctx.setLineDash([]);\n  [a, b].forEach((x) => {\n    ctx.beginPath();\n    ctx.moveTo(x, y - 5);\n    ctx.lineTo(x, y + 5);\n    ctx.stroke();\n  });\n  ctx.font = '700 11px \"JetBrains Mono\", monospace';\n  ctx.textAlign = 'center';\n  const mid = (a + b) / 2;\n  const w = ctx.measureText(label).width + 10;\n  ctx.fillStyle = 'rgba(255,255,255,0.9)';\n  ctx.fillRect(mid - w / 2, y - 9, w, 16);\n  ctx.fillStyle = '#212529';\n  ctx.fillText(label, mid, y + 3);\n}\n\n/** Linha vermelha indicando até onde o canhão pode recuar. */\nexport function drawRecoilLimit(ctx: CanvasRenderingContext2D, cam: Camera, x: number, groundY: number): void {\n  const bottom = toScreen(cam, { x, y: groundY });\n  ctx.strokeStyle = '#e03131';\n  ctx.lineWidth = 2;\n  ctx.setLineDash([5, 4]);\n  ctx.beginPath();\n  ctx.moveTo(bottom.x, bottom.y);\n  ctx.lineTo(bottom.x, bottom.y - 60);\n  ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.fillStyle = '#c92a2a';\n  ctx.font = '700 11px Nunito, sans-serif';\n  ctx.textAlign = 'center';\n  ctx.fillText('limite de recuo', Math.max(48, bottom.x), bottom.y - 66);\n}\n", "src/render/Vectors.ts": "/** Setas de vetores (velocidade, gravidade, vento, arrasto, ação e reação). */\nimport type { Vec2 } from '../core/types';\n\nexport const VECTOR_COLORS = {\n  velocity: '#2f9e44',\n  gravity: '#e03131',\n  wind: '#1c7ed6',\n  drag: '#f08c00',\n  action: '#7048e8',\n  reaction: '#d6336c',\n} as const;\n\nexport type VectorKind = keyof typeof VECTOR_COLORS;\n\n/** Converte o módulo de uma grandeza em comprimento de seta, com limites legíveis. */\nexport function arrowLength(magnitude: number, pxPerUnit: number, min = 16, max = 130): number {\n  if (magnitude <= 1e-9) return 0;\n  return Math.min(max, Math.max(min, magnitude * pxPerUnit));\n}\n\n/**\n * Desenha uma seta a partir de `from` (tela) na direção `dir` (mundo: Y para cima).\n */\nexport function drawArrow(\n  ctx: CanvasRenderingContext2D,\n  from: Vec2,\n  dir: Vec2,\n  len: number,\n  color: string,\n  label?: string,\n  alpha = 1,\n): void {\n  const mag = Math.hypot(dir.x, dir.y);\n  if (len <= 0 || mag === 0) return;\n  const ux = dir.x / mag;\n  const uy = -dir.y / mag; // tela tem Y invertido\n  const to = { x: from.x + ux * len, y: from.y + uy * len };\n  const head = Math.min(10, len * 0.4);\n\n  ctx.save();\n  ctx.globalAlpha = alpha;\n  ctx.strokeStyle = color;\n  ctx.fillStyle = color;\n  ctx.lineWidth = 3;\n  ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(from.x, from.y);\n  ctx.lineTo(to.x - ux * head * 0.6, to.y - uy * head * 0.6);\n  ctx.stroke();\n  ctx.beginPath();\n  ctx.moveTo(to.x, to.y);\n  ctx.lineTo(to.x - ux * head - uy * head * 0.55, to.y - uy * head + ux * head * 0.55);\n  ctx.lineTo(to.x - ux * head + uy * head * 0.55, to.y - uy * head - ux * head * 0.55);\n  ctx.closePath();\n  ctx.fill();\n  if (label) {\n    ctx.font = '800 11px Nunito, sans-serif';\n    ctx.textAlign = 'center';\n    const lx = to.x + ux * 12;\n    const ly = to.y + uy * 12 + 4;\n    ctx.lineWidth = 3;\n    ctx.strokeStyle = 'rgba(255,255,255,0.9)';\n    ctx.strokeText(label, lx, ly);\n    ctx.fillText(label, lx, ly);\n  }\n  ctx.restore();\n}\n"};</script>
<script data-entry="src/main">
/*
 * Mini carregador de módulos (sem etapa de build).
 *
 * 1. Busca os arquivos .ts/.tsx via fetch.
 * 2. Transpila cada um com o Babel (presets TypeScript + React) para CommonJS.
 * 3. Descobre as dependências (require("./x")) e carrega o grafo inteiro.
 * 4. Executa os módulos de forma síncrona, com um `require` próprio.
 *
 * Observação: o Babel apenas remove os tipos; ele NÃO faz checagem de tipos.
 * Com Node instalado, `npx tsc --noEmit` usa o tsconfig.json do projeto para isso.
 */
(function () {
  'use strict';

  var EXTERNALS = {
    react: function () { return window.React; },
    'react-dom': function () { return window.ReactDOM; },
    'react-dom/client': function () { return window.ReactDOM; },
  };

  var pending = {};   // caminho base -> Promise<registro>
  var registry = {};  // caminho base -> { path, code, deps }
  var instances = {}; // caminho base -> module

  function dirname(p) {
    var i = p.lastIndexOf('/');
    return i < 0 ? '' : p.slice(0, i);
  }

  function join(base, spec) {
    var parts = base ? base.split('/') : [];
    spec.split('/').forEach(function (seg) {
      if (seg === '.' || seg === '') return;
      if (seg === '..') parts.pop();
      else parts.push(seg);
    });
    return parts.join('/');
  }

  function candidatesFor(base) {
    if (/\.(tsx?|js)$/.test(base)) return [base];
    var tsxFirst = /(components|screens|render\/react)\//.test(base) || /(main|App)$/.test(base);
    return tsxFirst ? [base + '.tsx', base + '.ts'] : [base + '.ts', base + '.tsx'];
  }

  async function fetchSource(base) {
    var list = candidatesFor(base);
    // Versão empacotada (dist/): os fontes já vêm embutidos na página.
    var bundled = window.__SOURCES__;
    if (bundled) {
      for (var j = 0; j < list.length; j++) {
        if (Object.prototype.hasOwnProperty.call(bundled, list[j])) return { path: list[j], src: bundled[list[j]] };
      }
    }
    for (var i = 0; i < list.length; i++) {
      var res = await fetch(list[i], { cache: 'no-cache' });
      if (res.ok) return { path: list[i], src: await res.text() };
    }
    throw new Error('Módulo não encontrado: ' + base + ' (tentado: ' + list.join(', ') + ')');
  }

  function transpile(path, src) {
    return window.Babel.transform(src, {
      filename: path,
      sourceType: 'module',
      presets: [
        ['typescript', { isTSX: path.endsWith('.tsx'), allExtensions: true }],
        ['react', { runtime: 'classic' }],
      ],
      plugins: ['transform-modules-commonjs'],
    }).code;
  }

  function loadModule(base) {
    if (pending[base]) return pending[base];
    pending[base] = (async function () {
      var found = await fetchSource(base);
      var code;
      try {
        code = transpile(found.path, found.src);
      } catch (err) {
        throw new Error('Erro de sintaxe em ' + found.path + ':\n' + err.message);
      }
      var deps = {};
      var jobs = [];
      var re = /require\((["'])([^"']+)\1\)/g;
      var m;
      while ((m = re.exec(code))) {
        var spec = m[2];
        if (EXTERNALS[spec] || deps[spec]) continue;
        var resolved = join(dirname(found.path), spec);
        deps[spec] = resolved;
        jobs.push(loadModule(resolved));
      }
      registry[base] = { path: found.path, code: code, deps: deps };
      await Promise.all(jobs);
      return registry[base];
    })();
    return pending[base];
  }

  function execute(base) {
    if (instances[base]) return instances[base].exports;
    var rec = registry[base];
    if (!rec) throw new Error('Módulo não carregado: ' + base);
    var module = { exports: {} };
    instances[base] = module;
    var localRequire = function (spec) {
      if (EXTERNALS[spec]) return EXTERNALS[spec]();
      return execute(rec.deps[spec]);
    };
    var fn = new Function('require', 'module', 'exports', rec.code + '\n//# sourceURL=' + location.origin + '/' + rec.path);
    fn(localRequire, module, module.exports);
    return module.exports;
  }

  function showError(err) {
    console.error(err);
    var box = document.getElementById('boot-error');
    if (!box) return;
    box.hidden = false;
    var pre = box.querySelector('pre');
    if (pre) pre.textContent = String(err && err.message ? err.message : err);
    var spinner = document.getElementById('boot-loading');
    if (spinner) spinner.hidden = true;
  }

  async function start(entry) {
    if (location.protocol === 'file:' && !window.__SOURCES__) {
      showError(new Error(
        'Este projeto precisa ser aberto por um servidor local (o navegador bloqueia fetch em file://).\n\n' +
        'Dê dois cliques em "iniciar.bat" ou rode, nesta pasta:\n  python -m http.server 5173\n' +
        'e abra http://localhost:5173'
      ));
      return;
    }
    try {
      if (!window.React || !window.ReactDOM || !window.Babel) {
        throw new Error('Não foi possível carregar React/Babel da CDN. Verifique sua conexão com a internet.');
      }
      await loadModule(entry);
      execute(entry);
      var spinner = document.getElementById('boot-loading');
      if (spinner) spinner.hidden = true;
    } catch (err) {
      showError(err);
    }
  }

  window.ModuleLoader = { start: start };
  var script = document.currentScript;
  var entry = script && script.getAttribute('data-entry');
  if (entry) window.addEventListener('DOMContentLoaded', function () { start(entry); });
})();

</script>
