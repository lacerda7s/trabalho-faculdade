      { label: 'vx', color: '#1c7ed6', values: samples.map((s) => s.vx) },\n              { label: 'vy', color: '#e8590c', values: samples.map((s) => s.vy) },\n            ]}\n          />\n          <LineChart\n            title=\"Aceleração\"\n            unit=\"m/s²\"\n            times={samples.map((s) => s.t)}\n            series={[\n              { label: 'ax', color: '#1c7ed6', values: samples.map((s) => s.ax) },\n              { label: 'ay', color: '#e8590c', values: samples.map((s) => s.ay) },\n            ]}\n          />\n        <\/div>\n      )}\n    <\/section>\n  );\n}\n", "src/components/NewtonLawsScreen.tsx": "/** Tela \"Leis de Newton\" com mini animações de cada lei. */\nimport React from 'react';\nimport { NEWTON_LAWS } from '../core/education';\n\nfunction Demo({ law }: { law: 1 | 2 | 3 }) {\n  if (law === 1) {\n    return (\n      <svg viewBox=\"0 0 300 110\" className=\"law-demo\" aria-label=\"Bola seguindo em linha reta com velocidade constante\">\n        <rect width=\"300\" height=\"110\" rx=\"12\" fill=\"#0b1e3f\" />\n        {[20, 60, 100, 140, 180, 220, 260].map((x) => (\n          <circle key={x} cx={x} cy=\"55\" r=\"1.6\" fill=\"#4dabf7\" opacity=\"0.6\" />\n        ))}\n        <circle className=\"demo-inertia\" cy=\"55\" r=\"10\" fill=\"#ffd43b\" />\n        <text x=\"150\" y=\"98\" textAnchor=\"middle\" fill=\"#a5d8ff\" fontSize=\"11\">sem forças → mesma velocidade, mesma direção<\/text>\n      <\/svg>\n    );\n  }\n  if (law === 2) {\n    return (\n      <svg viewBox=\"0 0 300 110\" className=\"law-demo\" aria-label=\"Mesma força em massas diferentes: a leve acelera mais\">\n        <rect width=\"300\" height=\"110\" rx=\"12\" fill=\"#0b1e3f\" />\n        <g className=\"demo-light\">\n          <circle cy=\"35\" r=\"8\" fill=\"#ff8787\" />\n        <\/g>\n        <g className=\"demo-heavy\">\n          <circle cy=\"75\" r=\"15\" fill=\"#748ffc\" />\n        <\/g>\n        <text x=\"290\" y=\"38\" textAnchor=\"end\" fill=\"#ffc9c9\" fontSize=\"11\">m pequena → a grande<\/text>\n        <text x=\"290\" y=\"79\" textAnchor=\"end\" fill=\"#bac8ff\" fontSize=\"11\">m grande → a pequena<\/text>\n      <\/svg>\n    );\n  }\n  return (\n    <svg viewBox=\"0 0 300 110\" className=\"law-demo\" aria-label=\"Canhão recua enquanto o projétil vai para frente\">\n      <rect width=\"300\" height=\"110\" rx=\"12\" fill=\"#0b1e3f\" />\n      <line x1=\"0\" y1=\"88\" x2=\"300\" y2=\"88\" stroke=\"#495057\" />\n      <g className=\"demo-cannon\">\n        <rect x=\"110\" y=\"58\" width=\"48\" height=\"16\" rx=\"7\" fill=\"#adb5bd\" />\n        <circle cx=\"122\" cy=\"78\" r=\"10\" fill=\"#8d5524\" />\n      <\/g>\n      <circle className=\"demo-shot\" cy=\"66\" r=\"6\" fill=\"#ffd43b\" />\n      <text x=\"70\" y=\"30\" fill=\"#f783ac\" fontSize=\"11\" textAnchor=\"middle\">← reação<\/text>\n      <text x=\"230\" y=\"30\" fill=\"#b197fc\" fontSize=\"11\" textAnchor=\"middle\">ação →<\/text>\n    <\/svg>\n  );\n}\n\nexport function NewtonLawsScreen({ onPlay }: { onPlay: () => void }) {\n  return (\n    <div className=\"page\">\n      <header className=\"page-head\">\n        <h1>As três leis de Newton<\/h1>\n        <p>Publicadas em 1687 nos “Principia”, elas descrevem como forças mudam o movimento — exatamente o que o simulador calcula a cada 1/120 s.<\/p>\n      <\/header>\n      <div className=\"laws-grid\">\n        {NEWTON_LAWS.map((law) => (\n          <article key={law.id} className={`law-full law-${law.id}`}>\n            <span className={`law-badge law-${law.id}`}>{law.id}ª lei<\/span>\n            <h2>{law.name}<\/h2>\n            <Demo law={law.id} />\n            <p className=\"statement\">{law.statement}<\/p>\n            <code className=\"formula\">{law.formula}<\/code>\n            <h3>No jogo<\/h3>\n            <ul>\n              {law.inTheGame.map((t) => (\n                <li key={t}>{t}<\/li>\n              ))}\n            <\/ul>\n          <\/article>\n        ))}\n      <\/div>\n      <div className=\"page-cta\">\n        <button type=\"button\" className=\"btn btn-fire btn-big\" onClick={onPlay}>\n          Testar no Modo Aprendizado ▶\n        <\/button>\n      <\/div>\n    <\/div>\n  );\n}\n", "src/components/StatsPanel.tsx": "/** Indicadores numéricos e medidores de força, aceleração e velocidade. */\nimport React from 'react';\nimport type { ForceBreakdown, RecoilInfo } from '../core/types';\nimport { VECTOR_COLORS } from '../render/Vectors';\n\nexport interface HudSnapshot {\n  t: number;\n  x: number;\n  y: number;\n  vx: number;\n  vy: number;\n  speed: number;\n  accel: number;\n  forces: ForceBreakdown;\n}\n\nconst fmt = (n: number, d = 1) =>\n  Number.isFinite(n) ? n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';\n\nfunction Meter({ label, value, max, unit, color, digits = 0 }: { label: string; value: number; max: number; unit: string; color: string; digits?: number }) {\n  const ratio = Number.isFinite(value) ? Math.max(0, Math.min(1, value / max)) : 0;\n  return (\n    <div className=\"meter\">\n      <div className=\"meter-head\">\n        <span>{label}<\/span>\n        <strong>\n          {fmt(value, digits)} <small>{unit}<\/small>\n        <\/strong>\n      <\/div>\n      <div className=\"meter-track\">\n        <div className=\"meter-fill\" style={{ width: `${ratio * 100}%`, background: color }} />\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction Stat({ label, value, unit, tone }: { label: string; value: string; unit?: string; tone?: string }) {\n  return (\n    <div className={`stat ${tone ?? ''}`}>\n      <span>{label}<\/span>\n      <strong>\n        {value}\n        {unit && <small> {unit}<\/small>}\n      <\/strong>\n    <\/div>\n  );\n}\n\ninterface StatsPanelProps {\n  force: number;\n  mass: number;\n  acceleration: number;\n  launchSpeed: number;\n  distanceToTarget: number;\n  flightTime: number | null;\n  flightTimeIsEstimate: boolean;\n  maxHeight: number | null;\n  recoil: RecoilInfo | null;\n  maxRecoil?: number;\n  hud: HudSnapshot | null;\n}\n\nexport function StatsPanel(p: StatsPanelProps) {\n  const recoilWarn = p.recoil && p.maxRecoil !== undefined && p.recoil.distance > p.maxRecoil;\n  return (\n    <section className=\"panel stats\" aria-label=\"Indicadores\">\n      <h3 className=\"panel-title\">\n        <span className=\"dot dot-green\" /> Indicadores (antes do disparo)\n      <\/h3>\n      <div className=\"meters\">\n        <Meter label=\"Força aplicada (F)\" value={p.force} max={12000} unit=\"N\" color=\"#7048e8\" />\n        <Meter label=\"Aceleração no cano (a = F/m)\" value={p.acceleration} max={12000} unit=\"m/s²\" color=\"#f08c00\" />\n        <Meter label=\"Velocidade inicial (v₀ = a·Δt)\" value={p.launchSpeed} max={60} unit=\"m/s\" color={VECTOR_COLORS.velocity} digits={1} />\n      <\/div>\n      <div className=\"stat-grid\">\n        <Stat label=\"Massa do projétil\" value={fmt(p.mass)} unit=\"kg\" />\n        <Stat label=\"Distância até o alvo\" value={fmt(p.distanceToTarget)} unit=\"m\" />\n        <Stat label={p.flightTimeIsEstimate ? 'Tempo de voo (estimativa)' : 'Tempo de voo previsto'} value={p.flightTime === null ? '—' : fmt(p.flightTime, 2)} unit=\"s\" />\n        <Stat label=\"Altura máxima prevista\" value={p.maxHeight === null ? '—' : fmt(p.maxHeight)} unit=\"m\" />\n        <Stat label=\"Recuo do canhão\" value={p.recoil ? fmt(p.recoil.velocity, 2) : '—'} unit=\"m/s\" />\n        <Stat\n          label={p.maxRecoil !== undefined ? `Distância de recuo (máx ${fmt(p.maxRecoil)} m)` : 'Distância de recuo'}\n          value={p.recoil ? fmt(p.recoil.distance, 2) : '—'}\n          unit=\"m\"\n          tone={recoilWarn ? 'warn' : p.maxRecoil !== undefined ? 'ok' : ''}\n        />\n      <\/div>\n\n      {p.hud && (\n        <>\n          <h4 className=\"sub-title\">Em tempo real<\/h4>\n          <div className=\"stat-grid live\">\n            <Stat label=\"t\" value={fmt(p.hud.t, 2)} unit=\"s\" />\n            <Stat label=\"x\" value={fmt(p.hud.x)} unit=\"m\" />\n            <Stat label=\"y\" value={fmt(p.hud.y)} unit=\"m\" />\n            <Stat label=\"|v|\" value={fmt(p.hud.speed)} unit=\"m/s\" />\n            <Stat label=\"vx\" value={fmt(p.hud.vx)} unit=\"m/s\" />\n            <Stat label=\"|a|\" value={fmt(p.hud.accel, 2)} unit=\"m/s²\" />\n          <\/div>\n        <\/>\n      )}\n    <\/section>\n  );\n}\n\nexport function VectorLegend() {\n  const items = [\n    { color: VECTOR_COLORS.velocity, label: 'Velocidade (v)' },\n    { color: VECTOR_COLORS.gravity, label: 'Gravidade (g)' },\n    { color: VECTOR_COLORS.wind, label: 'Vento' },\n    { color: VECTOR_COLORS.drag, label: 'Resistência do ar' },\n    { color: VECTOR_COLORS.action, label: 'Ação (no projétil)' },\n    { color: VECTOR_COLORS.reaction, label: 'Reação (no canhão)' },\n  ];\n  return (\n    <div className=\"legend\" aria-label=\"Legenda dos vetores\">\n      {items.map((i) => (\n        <span key={i.label}>\n          <i style={{ background: i.color }} />\n          {i.label}\n        <\/span>\n      ))}\n      <span>\n        <i className=\"legend-dots\" />\n        Trajetória prevista\n      <\/span>\n    <\/div>\n  );\n}\n", "src/core/Cannon.ts": "/**\n * Geometria do canhão. Física e desenho usam a MESMA geometria,\n * para que o projétil saia exatamente da boca do cano desenhado.\n */\nimport type { Vec2 } from './types';\nimport { fromAngle } from './vector';\n\n/** altura do eixo de rotação acima do solo (m) */\nexport const PIVOT_HEIGHT = 1.4;\n/** comprimento do cano (m) */\nexport const BARREL_LENGTH = 3.2;\n/** diâmetro externo do cano (m) */\nexport const BARREL_WIDTH = 0.9;\nexport const WHEEL_RADIUS = 1.2;\n\nexport function pivotPosition(baseX: number, groundY: number, recoilOffset = 0): Vec2 {\n  return { x: baseX - recoilOffset, y: groundY + PIVOT_HEIGHT };\n}\n\n/** Posição da boca do cano, de onde o projétil é lançado. */\nexport function muzzlePosition(baseX: number, groundY: number, angleDeg: number, recoilOffset = 0): Vec2 {\n  const pivot = pivotPosition(baseX, groundY, recoilOffset);\n  const tip = fromAngle(angleDeg, BARREL_LENGTH);\n  return { x: pivot.x + tip.x, y: pivot.y + tip.y };\n}\n", "src/core/CollisionDetector.ts": "/**\n * Detecção de colisões entre o projétil (círculo) e o cenário.\n * Ordem de verificação: alvo → obstáculos → solo.\n */\nimport type { Bounds, CollisionResult, Rect, SimEnvironment, TargetSpec, TerrainPoint, Vec2 } from './types';\nimport { heightAt } from './Terrain';\nimport { clamp, distance } from './vector';\n\n/** Círculo × retângulo: compara a distância ao ponto mais próximo do retângulo. */\nexport function circleIntersectsRect(center: Vec2, radius: number, rect: Rect): boolean {\n  const cx = clamp(center.x, rect.x, rect.x + rect.width);\n  const cy = clamp(center.y, rect.y, rect.y + rect.height);\n  const dx = center.x - cx;\n  const dy = center.y - cy;\n  return dx * dx + dy * dy <= radius * radius;\n}\n\nexport function checkTargetHit(position: Vec2, radius: number, target: TargetSpec): { hit: boolean; distance: number } {\n  const d = distance(position, target);\n  return { hit: d <= target.radius + radius, distance: d };\n}\n\nexport function isTouchingGround(position: Vec2, radius: number, terrain: TerrainPoint[]): boolean {\n  return position.y - radius <= heightAt(terrain, position.x);\n}\n\n/** Índice do primeiro obstáculo atingido, ou -1. */\nexport function findObstacleHit(position: Vec2, radius: number, obstacles: Rect[]): number {\n  return obstacles.findIndex((o) => circleIntersectsRect(position, radius, o));\n}\n\nexport function isOutOfBounds(position: Vec2, bounds: Bounds): boolean {\n  return position.x < bounds.minX || position.x > bounds.maxX || position.y < bounds.minY;\n}\n\n/**\n * Verifica colisões na posição atual.\n * O alvo funciona como \"sensor\" e é verificado mesmo com colisões desligadas.\n */\nexport function detectCollision(position: Vec2, radius: number, env: SimEnvironment): CollisionResult {\n  const target = checkTargetHit(position, radius, env.target);\n  if (target.hit) return { type: 'target', distance: target.distance };\n  if (!env.world.toggles.collisions) return { type: 'none' };\n  const index = findObstacleHit(position, radius, env.obstacles);\n  if (index >= 0) return { type: 'obstacle', index };\n  if (isTouchingGround(position, radius, env.terrain)) {\n    return { type: 'ground', groundY: heightAt(env.terrain, position.x) };\n  }\n  return { type: 'none' };\n}\n", "src/core/education.ts": "/**\n * Conteúdo educativo e geração de feedback após cada disparo.\n * Também é regra de negócio: recebe números e devolve textos, sem tocar na interface.\n */\nimport type { FeedbackItem, LevelConfig, ShotRecord, WorldSettings } from './types';\nimport { launchAcceleration } from './PhysicsEngine';\nimport { windForce } from './WindSystem';\nimport { PROJECTILES } from './Projectile';\nimport { toRadians } from './vector';\n\nexport interface NewtonLaw {\n  id: 1 | 2 | 3;\n  name: string;\n  statement: string;\n  formula: string;\n  inTheGame: string[];\n}\n\nexport const NEWTON_LAWS: NewtonLaw[] = [\n  {\n    id: 1,\n    name: 'Lei da Inércia',\n    statement:\n      'Todo corpo permanece em repouso ou em movimento retilíneo uniforme, a menos que uma força resultante atue sobre ele.',\n    formula: 'ΣF = 0  ⇒  v constante',\n    inTheGame: [\n      'Depois que sai do cano, nada empurra o projétil para frente: ele continua andando por inércia.',\n      'Sem vento e sem ar, nenhuma força horizontal atua, então vx fica constante durante todo o voo.',\n      'Desligue a gravidade no laboratório: o projétil segue em linha reta para sempre.',\n    ],\n  },\n  {\n    id: 2,\n    name: 'Princípio Fundamental da Dinâmica',\n    statement: 'A força resultante sobre um corpo é igual ao produto da sua massa pela sua aceleração.',\n    formula: 'F = m · a   ⇒   a = F / m',\n    inTheGame: [\n      'Dentro do cano, a pólvora aplica a força F durante 0,01 s: a = F/m e v₀ = a · 0,01 s.',\n      'Com a mesma força, um projétil mais leve recebe mais aceleração e sai mais rápido.',\n      'O vento aplica uma força: projéteis leves (m pequeno) são mais desviados.',\n    ],\n  },\n  {\n    id: 3,\n    name: 'Ação e Reação',\n    statement:\n      'A toda ação corresponde uma reação de mesmo módulo, mesma direção e sentido oposto, atuando em corpos diferentes.',\n    formula: 'F(canhão→projétil) = −F(projétil→canhão)',\n    inTheGame: [\n      'O canhão empurra o projétil para frente; o projétil empurra o canhão para trás.',\n      'O momento se conserva: m · v = M · V. Canhão pesado → recuo pequeno.',\n      'As forças do par atuam em corpos diferentes, por isso não se anulam.',\n    ],\n  },\n];\n\nconst fmt = (n: number, digits = 1): string =>\n  n.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });\n\nexport interface FeedbackInput {\n  shot: ShotRecord;\n  level: LevelConfig;\n  world: WorldSettings;\n  /** deslocamento horizontal causado pelo vento (m), se calculado */\n  windDrift: number | null;\n  /** velocidade horizontal ao final do voo (m/s) */\n  finalVx: number;\n}\n\n/** Explicações mostradas logo após o disparo (durante o voo). */\nexport function launchFeedback(params: ShotRecord['params'], speed: number, world: WorldSettings, cannonRecoil: number): FeedbackItem[] {\n  const a = launchAcceleration(params.force, params.mass);\n  const items: FeedbackItem[] = [\n    {\n      law: 2,\n      tone: 'info',\n      title: '2ª lei: a pólvora acelera o projétil',\n      text: `a = F/m = ${fmt(params.force, 0)} N ÷ ${fmt(params.mass)} kg = ${fmt(a, 0)} m/s². Em 0,01 s ele atinge v₀ = ${fmt(speed)} m/s.`,\n    },\n    {\n      law: 1,\n      tone: 'info',\n      title: '1ª lei: agora ele segue por inércia',\n      text: world.toggles.gravity\n        ? 'Nenhuma força o empurra para frente. Só a gravidade (e, se ativos, vento e ar) muda sua trajetória.'\n        : 'Gravidade desligada: sem força resultante, ele segue em linha reta com velocidade constante.',\n    },\n  ];\n  if (world.toggles.recoil) {\n    items.push({\n      law: 3,\n      tone: 'info',\n      title: '3ª lei: o canhão recua',\n      text: `Mesma força, sentido oposto. O canhão recua a ${fmt(cannonRecoil, 2)} m/s.`,\n    });\n  }\n  return items;\n}\n\n/** Explicações após o projétil parar. */\nexport function generateShotFeedback(input: FeedbackInput): FeedbackItem[] {\n  const { shot, level, world } = input;\n  const items: FeedbackItem[] = [];\n  const p = shot.params;\n\n  // Resultado: antes, depois, obstáculo ou acerto\n  if (shot.outcome === 'hit') {\n    items.push({ law: null, tone: 'success', title: 'Na mosca!', text: `O projétil acertou a ${fmt(shot.targetDistance ?? 0, 2)} m do centro do alvo.` });\n  } else if (shot.outcome === 'obstacle') {\n    items.push({\n      law: null,\n      tone: 'warning',\n      title: 'Bateu no obstáculo',\n      text: 'A trajetória cruzou uma barreira. Aumente o ângulo para ganhar altura ou mude a força para mudar o ponto mais alto.',\n    });\n  } else if (shot.impactX !== null) {\n    const diff = shot.impactX - level.target.x;\n    items.push(\n      diff < 0\n        ? {\n            law: null,\n            tone: 'warning',\n            title: `Caiu ${fmt(Math.abs(diff))} m antes do alvo`,\n            text: 'Faltou alcance: aumente a força, reduza a massa ou aproxime o ângulo de 45°.',\n          }\n        : {\n            law: null,\n            tone: 'warning',\n            title: `Passou ${fmt(diff)} m do alvo`,\n            text: 'Sobrou alcance: reduza a força ou afaste o ângulo de 45°.',\n          },\n    );\n  } else {\n    items.push({ law: null, tone: 'warning', title: 'Saiu da área', text: 'O projétil deixou o cenário. Reduza a força ou ajuste o ângulo.' });\n  }\n\n  // Ângulo\n  const vx0 = shot.launchSpeed * Math.cos(toRadians(p.angleDeg));\n  const vy0 = shot.launchSpeed * Math.sin(toRadians(p.angleDeg));\n  items.push({\n    law: null,\n    tone: 'info',\n    title: `Ângulo de ${fmt(p.angleDeg, 0)}°`,\n    text:\n      `Velocidade dividida em vx = ${fmt(vx0)} m/s e vy = ${fmt(vy0)} m/s. ` +\n      (p.angleDeg > 45\n        ? 'Acima de 45° o projétil sobe mais, mas anda menos para frente.'\n        : p.angleDeg < 45\n          ? 'Abaixo de 45° a trajetória é mais rasante e rápida.'\n          : '45° divide a velocidade igualmente: alcance máximo no vácuo.'),\n  });\n\n  // 2ª lei — massa e aceleração\n  const a = launchAcceleration(p.force, p.mass);\n  items.push({\n    law: 2,\n    tone: 'info',\n    title: 'Massa × aceleração',\n    text: `Com ${fmt(p.mass)} kg, a força de ${fmt(p.force, 0)} N gerou ${fmt(a, 0)} m/s² no cano. Com o dobro da massa, a aceleração seria a metade (${fmt(a / 2, 0)} m/s²).`,\n  });\n\n  // 1ª lei — velocidade horizontal\n  const horizontalForces = (world.toggles.wind && world.windSpeed !== 0) || (world.toggles.airResistance && world.airDensityFactor > 0);\n  if (!horizontalForces) {\n    items.push({\n      law: 1,\n      tone: 'info',\n      title: 'vx permaneceu constante',\n      text: `Sem forças horizontais, a velocidade horizontal ficou em ${fmt(vx0)} m/s do início ao fim — inércia em ação.`,\n    });\n  } else if (world.toggles.airResistance && world.airDensityFactor > 0) {\n    const loss = vx0 !== 0 ? (1 - input.finalVx / vx0) * 100 : 0;\n    items.push({\n      law: 1,\n      tone: 'info',\n      title: 'O ar freou o projétil',\n      text: `O arrasto é uma força contrária ao movimento. A velocidade horizontal caiu cerca de ${fmt(Math.max(0, loss), 0)}% durante o voo.`,\n    });\n  }\n\n  // Vento\n  if (world.toggles.wind && world.windSpeed !== 0) {\n    const spec = PROJECTILES[p.projectile];\n    const f = windForce(world.windSpeed, spec.radius).x;\n    const drift = input.windDrift;\n    items.push({\n      law: 2,\n      tone: 'info',\n      title: 'O vento desviou o projétil',\n      text:\n        `Força do vento ≈ ${fmt(Math.abs(f))} N → a = F/m = ${fmt(Math.abs(f) / p.mass, 2)} m/s² ${world.windSpeed > 0 ? 'para frente' : 'para trás'}.` +\n        (drift !== null ? ` Deslocamento estimado: ${fmt(Math.abs(drift))} m ${drift >= 0 ? 'a mais' : 'a menos'}.` : ''),\n    });\n  }\n\n  // 3ª lei — recuo\n  if (world.toggles.recoil && shot.recoil.velocity > 0) {\n    items.push({\n      law: 3,\n      tone: shot.recoilViolation ? 'warning' : 'info',\n      title: shot.recoilViolation ? 'Recuo acima do limite!' : 'Ação e reação',\n      text: `Momento transferido: ${fmt(shot.recoil.momentum)} kg·m/s. Com ${fmt(p.cannonMass, 0)} kg, o canhão recuou a ${fmt(shot.recoil.velocity, 2)} m/s e andou ${fmt(shot.recoil.distance, 2)} m.`,\n    });\n  }\n\n  return items;\n}\n", "src/core/GameStateManager.ts": "/**\n * Máquina de estados do jogo.\n *\n * Cada estado só aceita alguns eventos. Um evento inválido NÃO muda o estado:\n * ele é registrado como erro (ex.: tentar disparar com um projétil já em voo).\n */\n\nexport type GameState = 'aiming' | 'flying' | 'paused' | 'result' | 'levelComplete' | 'levelFailed';\n\nexport type GameEventType =\n  | 'FIRE'\n  | 'PAUSE'\n  | 'RESUME'\n  | 'STEP'\n  | 'LAND'\n  | 'NEXT_SHOT'\n  | 'COMPLETE_LEVEL'\n  | 'FAIL_LEVEL'\n  | 'NEXT_LEVEL'\n  | 'RETRY'\n  | 'RESET';\n\nexport interface GameEvent {\n  type: GameEventType;\n}\n\nexport const TRANSITIONS: Record<GameState, Partial<Record<GameEventType, GameState>>> = {\n  aiming: { FIRE: 'flying', RESET: 'aiming' },\n  flying: { PAUSE: 'paused', LAND: 'result', RESET: 'aiming' },\n  paused: { RESUME: 'flying', STEP: 'paused', LAND: 'result', RESET: 'aiming' },\n  result: { NEXT_SHOT: 'aiming', COMPLETE_LEVEL: 'levelComplete', FAIL_LEVEL: 'levelFailed', RESET: 'aiming' },\n  levelComplete: { NEXT_LEVEL: 'aiming', RESET: 'aiming' },\n  levelFailed: { RETRY: 'aiming', RESET: 'aiming' },\n};\n\nexport const STATE_LABELS: Record<GameState, string> = {\n  aiming: 'Mirando',\n  flying: 'Em voo',\n  paused: 'Pausado',\n  result: 'Resultado',\n  levelComplete: 'Nível concluído',\n  levelFailed: 'Tentativas esgotadas',\n};\n\nexport interface TransitionLog {\n  from: GameState;\n  event: GameEventType;\n  to: GameState;\n  ok: boolean;\n}\n\nexport interface MachineState {\n  state: GameState;\n  history: TransitionLog[];\n  lastError: string | null;\n}\n\nexport function createMachine(): MachineState {\n  return { state: 'aiming', history: [], lastError: null };\n}\n\nexport function canTransition(state: GameState, event: GameEventType): boolean {\n  return TRANSITIONS[state][event] !== undefined;\n}\n\n/** Função pura de transição: (estado, evento) → próximo estado. */\nexport function transition(state: GameState, event: GameEventType): { state: GameState; error: string | null } {\n  const next = TRANSITIONS[state][event];\n  if (!next) return { state, error: `Evento \"${event}\" não é permitido no estado \"${STATE_LABELS[state]}\".` };\n  return { state: next, error: null };\n}\n\nconst HISTORY_SIZE = 8;\n\n/** Reducer compatível com React.useReducer. */\nexport function gameReducer(machine: MachineState, event: GameEvent): MachineState {\n  const result = transition(machine.state, event.type);\n  const log: TransitionLog = { from: machine.state, event: event.type, to: result.state, ok: !result.error };\n  return {\n    state: result.state,\n    history: [log, ...machine.history].slice(0, HISTORY_SIZE),\n    lastError: result.error,\n  };\n}\n", "src/core/LevelManager.ts": "/**\n * Níveis do jogo e regras de conclusão.\n *\n * Para criar um novo nível basta acrescentar um objeto `LevelConfig` ao array\n * LEVELS: terreno, alvo, obstáculos, vento, controles liberados, dificuldade\n * e restrições são todos dados — nenhum código novo é necessário.\n */\nimport type { GameMode, LabToggles, LevelConfig, LevelControls, ShotRecord, SimEnvironment, WorldSettings } from './types';\nimport { DEFAULT_GRAVITY } from './PhysicsEngine';\nimport { minHeight, validateTerrain } from './Terrain';\nimport { nextWind } from './WindSystem';\n\nconst ON: LabToggles = { gravity: true, wind: true, airResistance: true, collisions: true, recoil: true };\nconst toggles = (over: Partial<LabToggles>): LabToggles => ({ ...ON, ...over });\n\nconst BASIC_CONTROLS: LevelControls = {\n  angle: true,\n  force: true,\n  mass: false,\n  projectile: false,\n  cannonMass: false,\n  wind: false,\n  airDensity: false,\n  gravity: false,\n  toggles: false,\n};\nconst controls = (over: Partial<LevelControls>): LevelControls => ({ ...BASIC_CONTROLS, ...over });\n\nexport const LEVELS: LevelConfig[] = [\n  {\n    id: 1,\n    title: 'Introdução à trajetória',\n    subtitle: 'Gravidade e lançamento oblíquo',\n    intro:\n      'Sem vento e sem ar: só a gravidade puxa o projétil para baixo. A velocidade horizontal fica constante e a vertical diminui 9,81 m/s a cada segundo. Ajuste ângulo e força para acertar o alvo.',\n    newtonFocus: [1],\n    worldWidth: 60,\n    terrain: [{ x: -15, y: 0 }, { x: 80, y: 0 }],\n    cannonX: 0,\n    target: { x: 40, y: 3, radius: 2.2 },\n    obstacles: [],\n    wind: { base: 0, variation: 0 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 0, toggles: toggles({ wind: false, airResistance: false }) },\n    defaults: { angleDeg: 45, force: 6000, mass: 4, projectile: 'ferro', cannonMass: 400 },\n    controls: controls({}),\n    difficulty: { maxShots: 6, previewFraction: 1, previewIncludesWind: true, previewIncludesDrag: true },\n    constraints: {},\n    requirements: ['Acerte o alvo.'],\n    tips: ['Em 45° o alcance é máximo (no vácuo).', 'A linha pontilhada mostra a trajetória prevista.'],\n  },\n  {\n    id: 2,\n    title: 'Primeira e segunda leis de Newton',\n    subtitle: 'F = m · a: mesma força, massas diferentes',\n    intro:\n      'A força do canhão está limitada a 6000 N. Pela 2ª lei, a = F/m: um projétil mais leve ganha mais aceleração no cano e sai mais rápido. Acerte o alvo com DUAS massas diferentes.',\n    newtonFocus: [1, 2],\n    worldWidth: 70,\n    terrain: [{ x: -15, y: 0 }, { x: 30, y: 0 }, { x: 45, y: 2 }, { x: 90, y: 2 }],\n    cannonX: 0,\n    target: { x: 55, y: 5, radius: 2.2 },\n    obstacles: [],\n    wind: { base: 0, variation: 0 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 0, toggles: toggles({ wind: false, airResistance: false }) },\n    defaults: { angleDeg: 40, force: 6000, mass: 4, projectile: 'ferro', cannonMass: 400 },\n    controls: controls({ mass: true, projectile: true }),\n    difficulty: { maxShots: 8, previewFraction: 1, previewIncludesWind: true, previewIncludesDrag: true },\n    constraints: { maxForce: 6000, distinctMasses: 2 },\n    requirements: ['Força máxima: 6000 N.', 'Acerte o alvo com 2 massas diferentes.'],\n    tips: ['Com 4 kg e 6000 N o projétil não alcança: reduza a massa.', 'a = F/m → metade da massa, o dobro da aceleração.'],\n  },\n  {\n    id: 3,\n    title: 'Ação e reação',\n    subtitle: 'O recuo do canhão',\n    intro:\n      'Quando o canhão empurra o projétil para frente, o projétil empurra o canhão para trás com força de mesmo módulo (3ª lei). O canhão está num platô e não pode recuar mais de 0,5 m. Aumente a massa do canhão para reduzir o recuo.',\n    newtonFocus: [3],\n    worldWidth: 65,\n    terrain: [{ x: -15, y: 5 }, { x: 3, y: 5 }, { x: 8, y: 0 }, { x: 85, y: 0 }],\n    cannonX: 0,\n    target: { x: 50, y: 2.5, radius: 2.2 },\n    obstacles: [],\n    wind: { base: 0, variation: 0 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 0, toggles: toggles({ wind: false, airResistance: false }) },\n    defaults: { angleDeg: 35, force: 7000, mass: 4, projectile: 'ferro', cannonMass: 40 },\n    controls: controls({ cannonMass: true }),\n    difficulty: { maxShots: 6, previewFraction: 1, previewIncludesWind: true, previewIncludesDrag: true },\n    constraints: { maxRecoil: 0.5 },\n    requirements: ['Acerte o alvo.', 'Recuo do canhão de no máximo 0,5 m.'],\n    tips: ['Momento do projétil = momento do canhão: m·v = M·V.', 'Canhão mais pesado → menor velocidade de recuo.'],\n  },\n  {\n    id: 4,\n    title: 'Influência do vento',\n    subtitle: 'Compense a força do vento',\n    intro:\n      'Agora o vento empurra o projétil horizontalmente. A previsão NÃO inclui o vento: observe as bandeiras e compense. O vento muda a cada disparo.',\n    newtonFocus: [1, 2],\n    worldWidth: 80,\n    terrain: [{ x: -15, y: 0 }, { x: 40, y: 0 }, { x: 55, y: 3 }, { x: 72, y: 3 }, { x: 90, y: 0 }, { x: 100, y: 0 }],\n    cannonX: 0,\n    target: { x: 62, y: 6, radius: 2.2 },\n    obstacles: [],\n    wind: { base: -6, variation: 3 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 0, toggles: toggles({ airResistance: false }) },\n    defaults: { angleDeg: 45, force: 8000, mass: 4, projectile: 'ferro', cannonMass: 400 },\n    controls: controls({}),\n    difficulty: { maxShots: 6, previewFraction: 0.6, previewIncludesWind: false, previewIncludesDrag: true },\n    constraints: {},\n    requirements: ['Acerte o alvo apesar do vento.'],\n    tips: ['Vento contra (←) encurta o alcance: use mais força.', 'O vento é uma força extra: a = F_vento / m.'],\n  },\n  {\n    id: 5,\n    title: 'Resistência do ar',\n    subtitle: 'O projétil perde velocidade aos poucos',\n    intro:\n      'O ar exerce uma força contrária ao movimento (arrasto) que cresce com o quadrado da velocidade. Sem ela, vx seria constante (1ª lei); com ela, vx diminui. Experimente o projétil aerodinâmico.',\n    newtonFocus: [1, 2],\n    worldWidth: 90,\n    terrain: [{ x: -15, y: 0 }, { x: 35, y: 0 }, { x: 50, y: -3 }, { x: 62, y: -3 }, { x: 70, y: 0 }, { x: 110, y: 0 }],\n    cannonX: 0,\n    target: { x: 75, y: 3, radius: 2.4 },\n    obstacles: [],\n    wind: { base: 0, variation: 0 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 3, toggles: toggles({ wind: false }) },\n    defaults: { angleDeg: 40, force: 9000, mass: 4, projectile: 'ferro', cannonMass: 400 },\n    controls: controls({ projectile: true, mass: true }),\n    difficulty: { maxShots: 6, previewFraction: 0.5, previewIncludesWind: true, previewIncludesDrag: true },\n    constraints: {},\n    requirements: ['Acerte o alvo com resistência do ar 3× maior.'],\n    tips: ['Com arrasto, o melhor ângulo fica abaixo de 45°.', 'Arrasto menor (Cd) = menos perda de velocidade.'],\n  },\n  {\n    id: 6,\n    title: 'Obstáculos e colisões',\n    subtitle: 'Planeje uma trajetória que evite barreiras',\n    intro:\n      'Uma muralha e um bloco flutuante estão no caminho. Atingir um obstáculo encerra o disparo e tira pontos. Use ângulos altos para passar por cima.',\n    newtonFocus: [1, 2],\n    worldWidth: 80,\n    terrain: [{ x: -15, y: 0 }, { x: 100, y: 0 }],\n    cannonX: 0,\n    target: { x: 66, y: 3, radius: 2.2 },\n    obstacles: [\n      { x: 28, y: 0, width: 2, height: 14, label: 'Muralha' },\n      { x: 48, y: 18, width: 4, height: 4, label: 'Bloco' },\n    ],\n    wind: { base: 2, variation: 1 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 0, toggles: toggles({ airResistance: false }) },\n    defaults: { angleDeg: 55, force: 9000, mass: 4, projectile: 'ferro', cannonMass: 400 },\n    controls: controls({}),\n    difficulty: { maxShots: 7, previewFraction: 0.45, previewIncludesWind: true, previewIncludesDrag: true },\n    constraints: {},\n    requirements: ['Acerte o alvo sem tocar nos obstáculos.'],\n    tips: ['Mais ângulo = mais altura, porém menos alcance.', 'Cada obstáculo atingido custa 200 pontos.'],\n  },\n  {\n    id: 7,\n    title: 'Desafio de engenharia',\n    subtitle: 'Requisitos, restrições e eficiência',\n    intro:\n      'Como num projeto real, há requisitos e restrições. Acerte o alvo no platô em no máximo 3 disparos, com força ≤ 9000 N e recuo ≤ 0,5 m, enfrentando vento, ar e uma torre. Quanto menos força, maior a eficiência.',\n    newtonFocus: [1, 2, 3],\n    worldWidth: 115,\n    terrain: [\n      { x: -15, y: 0 },\n      { x: 20, y: 0 },\n      { x: 35, y: 4 },\n      { x: 60, y: 4 },\n      { x: 70, y: 0 },\n      { x: 88, y: 0 },\n      { x: 95, y: 8 },\n      { x: 130, y: 8 },\n    ],\n    cannonX: 0,\n    target: { x: 102, y: 11, radius: 2 },\n    obstacles: [{ x: 45, y: 4, width: 2, height: 16, label: 'Torre' }],\n    wind: { base: 3, variation: 2.5 },\n    world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 1.5, toggles: toggles({}) },\n    defaults: { angleDeg: 45, force: 9000, mass: 4, projectile: 'ferro', cannonMass: 80 },\n    controls: controls({ mass: true, projectile: true, cannonMass: true }),\n    difficulty: { maxShots: 3, previewFraction: 0.3, previewIncludesWind: false, previewIncludesDrag: false },\n    constraints: { maxForce: 9000, maxRecoil: 0.5 },\n    requirements: ['Acerte o alvo no platô.', 'No máximo 3 disparos.', 'Força ≤ 9000 N.', 'Recuo ≤ 0,5 m.'],\n    tips: ['Use o que aprendeu: massa, ângulo, vento, arrasto e recuo.', 'Eficiência: menos força gera bônus.'],\n  },\n];\n\n/** Cenário livre do Modo Laboratório. */\nexport const LAB_LEVEL: LevelConfig = {\n  id: 0,\n  title: 'Laboratório',\n  subtitle: 'Experimentos livres',\n  intro:\n    'Ligue e desligue forças, mude a gravidade, a massa do projétil e do canhão, compare trajetórias e acompanhe os gráficos. Pause e avance quadro a quadro para estudar cada instante.',\n  newtonFocus: [1, 2, 3],\n  worldWidth: 100,\n  terrain: [{ x: -15, y: 0 }, { x: 130, y: 0 }],\n  cannonX: 0,\n  target: { x: 60, y: 3, radius: 2.5 },\n  obstacles: [],\n  wind: { base: 0, variation: 0 },\n  world: { gravity: DEFAULT_GRAVITY, airDensityFactor: 1, toggles: toggles({ wind: false, airResistance: false }) },\n  defaults: { angleDeg: 45, force: 8000, mass: 4, projectile: 'ferro', cannonMass: 300 },\n  controls: {\n    angle: true,\n    force: true,\n    mass: true,\n    projectile: true,\n    cannonMass: true,\n    wind: true,\n    airDensity: true,\n    gravity: true,\n    toggles: true,\n  },\n  difficulty: { maxShots: 0, previewFraction: 1, previewIncludesWind: true, previewIncludesDrag: true },\n  constraints: {},\n  requirements: ['Experimente à vontade!'],\n  tips: ['Desligue a gravidade para ver a 1ª lei em ação.', 'Compare trajetórias mudando um único parâmetro por vez.'],\n};\n\nexport function getLevel(id: number): LevelConfig {\n  if (id === LAB_LEVEL.id) return LAB_LEVEL;\n  const level = LEVELS.find((l) => l.id === id);\n  if (!level) throw new Error(`Nível ${id} não existe.`);\n  return level;\n}\n\nexport function nextLevelId(id: number): number | null {\n  const index = LEVELS.findIndex((l) => l.id === id);\n  return index >= 0 && index < LEVELS.length - 1 ? LEVELS[index + 1].id : null;\n}\n\n/** Condições iniciais do mundo para um nível. */\nexport function worldFromLevel(level: LevelConfig, rng: () => number = Math.random): WorldSettings {\n  return {\n    gravity: level.world.gravity,\n    airDensityFactor: level.world.airDensityFactor,\n    toggles: { ...level.world.toggles },\n    windSpeed: level.wind.variation > 0 ? nextWind(level.wind.base, level.wind.variation, rng) : level.wind.base,\n  };\n}\n\nexport function buildEnvironment(level: LevelConfig, world: WorldSettings): SimEnvironment {\n  return {\n    world,\n    terrain: level.terrain,\n    target: level.target,\n    obstacles: level.obstacles,\n    bounds: { minX: -20, maxX: level.worldWidth + 20, minY: minHeight(level.terrain) - 20 },\n  };\n}\n\n/** Um acerto só conta se respeitar as restrições do nível. */\nexport function isValidHit(shot: ShotRecord): boolean {\n  return shot.outcome === 'hit' && !shot.recoilViolation;\n}\n\nexport interface LevelEvaluation {\n  complete: boolean;\n  failed: boolean;\n  validHits: number;\n  distinctMasses: number;\n  requiredMasses: number;\n  /** null = ilimitado */\n  shotsLeft: number | null;\n}\n\nexport function evaluateLevel(level: LevelConfig, shots: ShotRecord[], mode: GameMode): LevelEvaluation {\n  const hits = shots.filter(isValidHit);\n  const masses = new Set(hits.map((s) => s.params.mass.toFixed(1)));\n  const requiredMasses = level.constraints.distinctMasses ?? 1;\n  const complete = hits.length > 0 && masses.size >= requiredMasses;\n  const maxShots = mode === 'desafio' ? level.difficulty.maxShots : 0;\n  const shotsLeft = maxShots > 0 ? Math.max(0, maxShots - shots.length) : null;\n  return {\n    complete,\n    failed: !complete && shotsLeft === 0,\n    validHits: hits.length,\n    distinctMasses: masses.size,\n    requiredMasses,\n    shotsLeft,\n  };\n}\n\n/** Verifica se a configuração de um nível é coerente (útil ao criar níveis novos). */\nexport function validateLevel(level: LevelConfig): string[] {\n  const errors = validateTerrain(level.terrain).map((e) => `Nível ${level.id}: ${e}`);\n  if (level.target.radius <= 0) errors.push(`Nível ${level.id}: raio do alvo deve ser positivo.`);\n  if (level.target.x <= level.cannonX) errors.push(`Nível ${level.id}: o alvo deve estar à direita do canhão.`);\n  if (level.target.x > level.worldWidth) errors.push(`Nível ${level.id}: o alvo está fora da área visível.`);\n  if (level.difficulty.previewFraction < 0 || level.difficulty.previewFraction > 1) {\n    errors.push(`Nível ${level.id}: previewFraction deve estar entre 0 e 1.`);\n  }\n  return errors;\n}\n", "src/core/PhysicsEngine.ts": "/**\n * Motor de física: forças, integração numérica e recuo do canhão.\n *\n * Integração: Euler semi-implícito com passo fixo.\n *   a = F_total / m        (2ª lei de Newton)\n *   v ← v + a·Δt\n *   x ← x + v·Δt\n */\nimport type { Body, ForceBreakdown, RecoilInfo, Vec2, WorldSettings } from './types';\nimport { add, dot, length, scale, sub, toRadians, vec, ZERO } from './vector';\nimport { windForce } from './WindSystem';\n\nexport const DEFAULT_GRAVITY = 9.81;\n/** densidade do ar ao nível do mar (kg/m³) */\nexport const AIR_DENSITY = 1.225;\n/** tempo que a força da pólvora age sobre o projétil dentro do cano (s) */\nexport const BARREL_TIME = 0.01;\n/** passo fixo da simulação (s) — 120 atualizações por segundo */\nexport const FIXED_DT = 1 / 120;\n/** coeficiente de atrito de rolamento das rodas do canhão */\nexport const ROLLING_FRICTION = 0.05;\n/** abaixo desta velocidade normal o projétil para de quicar (m/s) */\nexport const REST_NORMAL_SPEED = 2.5;\n/** fração da velocidade tangencial mantida em cada quique */\nexport const GROUND_GRIP = 0.75;\n\n/** 2ª lei de Newton: a = F / m */\nexport function launchAcceleration(force: number, mass: number): number {\n  if (!(mass > 0)) throw new Error('A massa precisa ser positiva.');\n  return force / mass;\n}\n\n/** Velocidade na saída do cano: v₀ = a · Δt (partindo do repouso). */\nexport function launchSpeed(force: number, mass: number): number {\n  return launchAcceleration(force, mass) * BARREL_TIME;\n}\n\nexport const crossSectionArea = (radius: number): number => Math.PI * radius * radius;\n\nexport function gravityForce(mass: number, world: WorldSettings): Vec2 {\n  return world.toggles.gravity ? vec(0, -mass * world.gravity) : ZERO;\n}\n\n/** Arrasto quadrático: F = -½ · ρ · Cd · A · |v| · v */\nexport function dragForce(velocity: Vec2, radius: number, dragCoefficient: number, world: WorldSettings): Vec2 {\n  if (!world.toggles.airResistance || world.airDensityFactor <= 0) return ZERO;\n  const speed = length(velocity);\n  if (speed === 0) return ZERO;\n  const k = 0.5 * AIR_DENSITY * world.airDensityFactor * dragCoefficient * crossSectionArea(radius);\n  return scale(velocity, -k * speed);\n}\n\n/** Soma todas as forças que atuam no corpo. */\nexport function computeForces(body: Body, world: WorldSettings): ForceBreakdown {\n  const gravity = gravityForce(body.mass, world);\n  const wind = world.toggles.wind ? windForce(world.windSpeed, body.radius) : ZERO;\n  const drag = dragForce(body.velocity, body.radius, body.dragCoefficient, world);\n  return { gravity, wind, drag, total: add(add(gravity, wind), drag) };\n}\n\nexport interface StepResult {\n  body: Body;\n  forces: ForceBreakdown;\n  acceleration: Vec2;\n}\n\n/** Avança o corpo um passo de tempo. Não altera o corpo original. */\nexport function stepBody(body: Body, world: WorldSettings, dt: number): StepResult {\n  const forces = computeForces(body, world);\n  const acceleration = scale(forces.total, 1 / body.mass);\n  const velocity = add(body.velocity, scale(acceleration, dt));\n  const position = add(body.position, scale(velocity, dt));\n  return { body: { ...body, position, velocity }, forces, acceleration };\n}\n\n/**\n * Quique no solo: inverte a componente normal (multiplicada pela restituição)\n * e reduz a componente tangencial (atrito).\n * Retorna `null` quando o quique é fraco demais e o projétil deve parar.\n */\nexport function bounce(velocity: Vec2, normal: Vec2, restitution: number): Vec2 | null {\n  const vn = dot(velocity, normal);\n  if (vn >= 0) return velocity; // já está se afastando do solo\n  const normalOut = -vn * restitution;\n  if (normalOut < REST_NORMAL_SPEED) return null;\n  const tangential = sub(velocity, scale(normal, vn));\n  return add(scale(normal, normalOut), scale(tangential, GROUND_GRIP));\n}\n\n/**\n * 3ª lei de Newton + conservação do momento.\n * O projétil recebe momento m·v₀; o canhão recebe o mesmo momento no sentido oposto.\n * Só a componente horizontal faz o canhão andar (a vertical é absorvida pelo solo).\n */\nexport function computeRecoil(\n  projectileMass: number,\n  speed: number,\n  angleDeg: number,\n  cannonMass: number,\n  enabled: boolean,\n): RecoilInfo {\n  const momentum = projectileMass * speed * Math.cos(toRadians(angleDeg));\n  if (!enabled || cannonMass <= 0) return { momentum, velocity: 0, distance: 0 };\n  const velocity = momentum / cannonMass;\n  const distance = (velocity * velocity) / (2 * ROLLING_FRICTION * DEFAULT_GRAVITY);\n  return { momentum, velocity, distance };\n}\n", "src/core/Projectile.ts": "/**\n * Catálogo de projéteis e criação do corpo físico.\n */\nimport type { Body, ProjectileKind, ProjectileSpec, Vec2 } from './types';\n\nexport const PROJECTILES: Record<ProjectileKind, ProjectileSpec> = {\n  ferro: {\n    kind: 'ferro',\n    name: 'Bala de ferro',\n    description: 'Pesada e compacta: o vento e o ar a afetam pouco.',\n    defaultMass: 4,\n    radius: 0.08,\n    dragCoefficient: 0.47,\n    restitution: 0.1,\n    color: '#3b4252',\n  },\n  pedra: {\n    kind: 'pedra',\n    name: 'Pedra',\n    description: 'Formato irregular: mais arrasto que a bala de ferro.',\n    defaultMass: 2.5,\n    radius: 0.09,\n    dragCoefficient: 0.7,\n    restitution: 0.2,\n    color: '#8d7b68',\n  },\n  borracha: {\n    kind: 'borracha',\n    name: 'Bola de borracha',\n    description: 'Leve e grande: quica no chão e sofre muito com o vento.',\n    defaultMass: 1.2,\n    radius: 0.1,\n    dragCoefficient: 0.5,\n    restitution: 0.6,\n    color: '#e8590c',\n  },\n  aerodinamico: {\n    kind: 'aerodinamico',\n    name: 'Projétil aerodinâmico',\n    description: 'Formato de gota: arrasto muito baixo.',\n    defaultMass: 1.5,\n    radius: 0.06,\n    dragCoefficient: 0.12,\n    restitution: 0.05,\n    color: '#1c7ed6',\n  },\n};\n\nexport const PROJECTILE_KINDS = Object.keys(PROJECTILES) as ProjectileKind[];\n\nexport function isProjectileKind(value: string): value is ProjectileKind {\n  return Object.prototype.hasOwnProperty.call(PROJECTILES, value);\n}\n\n/** Cria o corpo físico de um projétil em uma posição e velocidade. */\nexport function createProjectileBody(spec: ProjectileSpec, mass: number, position: Vec2, velocity: Vec2): Body {\n  return {\n    position: { ...position },\n    velocity: { ...velocity },\n    mass,\n    radius: spec.radius,\n    dragCoefficient: spec.dragCoefficient,\n    restitution: spec.restitution,\n  };\n}\n", "src/core/ScoreSystem.ts": "/**\n * Pontuação do Modo Desafio.\n * Regras explícitas em uma tabela para facilitar ajustes e testes.\n */\nimport type { ShotOutcome } from './types';\nimport { clamp } from './vector';\n\nexport const SCORE_RULES = {\n  HIT_BASE: 500,\n  PRECISION_MAX: 500,\n  SAVED_SHOT_BONUS: 150,\n  LOW_FORCE_MAX: 300,\n  OBSTACLE_PENALTY: 200,\n  RECOIL_PENALTY: 150,\n} as const;\n\nexport interface ShotScoreInput {\n  outcome: ShotOutcome;\n  targetDistance: number | null;\n  targetRadius: number;\n  force: number;\n  forceLimit: number;\n  shotNumber: number;\n  /** 0 = ilimitado (sem bônus de disparos economizados) */\n  maxShots: number;\n  recoilViolation?: boolean;\n}\n\nexport interface ScoreLine {\n  label: string;\n  points: number;\n}\n\nexport interface ShotScore {\n  total: number;\n  lines: ScoreLine[];\n  /** 0..1 — 1 = acerto no centro exato */\n  precision: number;\n}\n\n/** Precisão de um acerto: 1 no centro, 0 na borda do alvo. */\nexport function hitPrecision(targetDistance: number, targetRadius: number): number {\n  if (targetRadius <= 0) return 0;\n  return clamp(1 - targetDistance / targetRadius, 0, 1);\n}\n\nexport function computeShotScore(input: ShotScoreInput): ShotScore {\n  const lines: ScoreLine[] = [];\n  let precision = 0;\n\n  if (input.outcome === 'hit' && input.targetDistance !== null) {\n    precision = hitPrecision(input.targetDistance, input.targetRadius);\n    lines.push({ label: 'Acerto no alvo', points: SCORE_RULES.HIT_BASE });\n    lines.push({ label: `Precisão (${Math.round(precision * 100)}%)`, points: Math.round(SCORE_RULES.PRECISION_MAX * precision) });\n\n    if (input.maxShots > 0) {\n      const saved = Math.max(0, input.maxShots - input.shotNumber);\n      if (saved > 0) lines.push({ label: `Disparos economizados (${saved})`, points: saved * SCORE_RULES.SAVED_SHOT_BONUS });\n    }\n\n    if (input.forceLimit > 0) {\n      const economy = clamp(1 - input.force / input.forceLimit, 0, 1);\n      const bonus = Math.round(SCORE_RULES.LOW_FORCE_MAX * economy);\n      if (bonus > 0) lines.push({ label: 'Bônus por pouca força', points: bonus });\n    }\n  }\n\n  if (input.outcome === 'obstacle') {\n    lines.push({ label: 'Atingiu obstáculo', points: -SCORE_RULES.OBSTACLE_PENALTY });\n  }\n  if (input.recoilViolation) {\n    lines.push({ label: 'Recuo acima do limite', points: -SCORE_RULES.RECOIL_PENALTY });\n  }\n\n  const total = lines.reduce((sum, l) => sum + l.points, 0);\n  return { total, lines, precision };\n}\n\n/** Pontuação acumulada nunca fica negativa. */\nexport function applyScore(current: number, delta: number): number {\n  return Math.max(0, current + delta);\n}\n\n/** Taxa de acerto (0..1). */\nexport function accuracyRate(hits: number, shots: number): number {\n  return shots <= 0 ? 0 : hits / shots;\n}\n\n/** Estrelas ao concluir um nível: menos disparos = mais estrelas. */\nexport function starRating(shotsUsed: number, maxShots: number): 1 | 2 | 3 {\n  if (shotsUsed <= 1) return 3;\n  if (maxShots > 0 && shotsUsed <= Math.ceil(maxShots / 2)) return 2;\n  if (maxShots <= 0 && shotsUsed <= 3) return 2;\n  return 1;\n}\n", "src/core/Simulation.ts": "/**\n * Simulação de um voo completo: integra a física passo a passo,\n * verifica colisões e registra amostras para gráficos.\n *\n * Por desempenho, `advanceFlight` altera o objeto `Flight` recebido\n * (ele é dono exclusivo do estado do voo em andamento).\n */\nimport type { Body, ForceBreakdown, ShotOutcome, SimEnvironment, SimSample, Vec2, WorldSettings } from './types';\nimport { bounce, computeForces, FIXED_DT, stepBody } from './PhysicsEngine';\nimport { detectCollision, isOutOfBounds } from './CollisionDetector';\nimport { normalAt } from './Terrain';\nimport { distance, scale } from './vector';\n\nexport const MAX_FLIGHT_TIME = 40;\nconst SAMPLE_EVERY = 3;\nconst TRAIL_EVERY = 2;\nconst MAX_BOUNCES = 8;\n\nexport interface Flight {\n  body: Body;\n  t: number;\n  steps: number;\n  samples: SimSample[];\n  trail: Vec2[];\n  outcome: ShotOutcome | null;\n  /** primeiro ponto onde o projétil tocou algo */\n  firstImpact: Vec2 | null;\n  obstacleIndex: number;\n  /** distância ao centro do alvo no momento do acerto */\n  targetDistance: number | null;\n  /** menor distância ao centro do alvo durante o voo */\n  closestApproach: number;\n  maxHeight: number;\n  bounces: number;\n  forces: ForceBreakdown;\n  acceleration: Vec2;\n}\n\nfunction sampleOf(t: number, body: Body, acceleration: Vec2): SimSample {\n  return {\n    t,\n    x: body.position.x,\n    y: body.position.y,\n    vx: body.velocity.x,\n    vy: body.velocity.y,\n    ax: acceleration.x,\n    ay: acceleration.y,\n  };\n}\n\nexport function createFlight(body: Body, world: WorldSettings): Flight {\n  const forces = computeForces(body, world);\n  const acceleration = scale(forces.total, 1 / body.mass);\n  return {\n    body,\n    t: 0,\n    steps: 0,\n    samples: [sampleOf(0, body, acceleration)],\n    trail: [{ ...body.position }],\n    outcome: null,\n    firstImpact: null,\n    obstacleIndex: -1,\n    targetDistance: null,\n    closestApproach: Infinity,\n    maxHeight: body.position.y,\n    bounces: 0,\n    forces,\n    acceleration,\n  };\n}\n\n/** Avança o voo um passo. Não faz nada se o voo já terminou. */\nexport function advanceFlight(flight: Flight, env: SimEnvironment, dt: number = FIXED_DT): Flight {\n  if (flight.outcome) return flight;\n\n  const step = stepBody(flight.body, env.world, dt);\n  flight.body = step.body;\n  flight.forces = step.forces;\n  flight.acceleration = step.acceleration;\n  flight.t += dt;\n  flight.steps += 1;\n\n  const pos = flight.body.position;\n  flight.maxHeight = Math.max(flight.maxHeight, pos.y);\n  flight.closestApproach = Math.min(flight.closestApproach, distance(pos, env.target));\n  if (flight.steps % TRAIL_EVERY === 0) flight.trail.push({ ...pos });\n  if (flight.steps % SAMPLE_EVERY === 0) flight.samples.push(sampleOf(flight.t, flight.body, flight.acceleration));\n\n  const collision = detectCollision(pos, flight.body.radius, env);\n  switch (collision.type) {\n    case 'target':\n      flight.targetDistance = Math.min(collision.distance, pathMissDistance(pos, flight.body.velocity, env.target));\n      finish(flight, 'hit');\n      return flight;\n    case 'obstacle':\n      flight.obstacleIndex = collision.index;\n      finish(flight, 'obstacle');\n      return flight;\n    case 'ground':\n      handleGround(flight, env, collision.groundY);\n      if (flight.outcome) return flight;\n      break;\n    case 'none':\n      break;\n  }\n\n  if (isOutOfBounds(pos, env.bounds)) finish(flight, 'outOfBounds');\n  else if (flight.t >= MAX_FLIGHT_TIME) finish(flight, 'timeout');\n  return flight;\n}\n\n/**\n * Precisão do acerto: o contato é detectado na borda do alvo, então medimos\n * a que distância do centro passaria a reta do movimento (|r × v̂|).\n */\nexport function pathMissDistance(position: Vec2, velocity: Vec2, center: Vec2): number {\n  const speed = Math.hypot(velocity.x, velocity.y);\n  if (speed === 0) return distance(position, center);\n  const rx = center.x - position.x;\n  const ry = center.y - position.y;\n  return Math.abs(rx * velocity.y - ry * velocity.x) / speed;\n}\n\nfunction handleGround(flight: Flight, env: SimEnvironment, groundY: number): void {\n  const body = flight.body;\n  if (!flight.firstImpact) flight.firstImpact = { x: body.position.x, y: groundY };\n  const normal = normalAt(env.terrain, body.position.x);\n  const bounced = flight.bounces < MAX_BOUNCES ? bounce(body.velocity, normal, body.restitution) : null;\n  // reposiciona o projétil sobre a superfície\n  flight.body = { ...body, position: { x: body.position.x, y: groundY + body.radius } };\n  if (!bounced) {\n    flight.body.velocity = { x: 0, y: 0 };\n    finish(flight, 'ground');\n    return;\n  }\n  flight.bounces += 1;\n  flight.body.velocity = bounced;\n}\n\nfunction finish(flight: Flight, outcome: ShotOutcome): void {\n  flight.outcome = outcome;\n  if (!flight.firstImpact && outcome !== 'outOfBounds' && outcome !== 'timeout') {\n    flight.firstImpact = { ...flight.body.position };\n  }\n  flight.trail.push({ ...flight.body.position });\n  flight.samples.push(sampleOf(flight.t, flight.body, flight.acceleration));\n}\n\n/** Simula um voo inteiro de uma vez (usado em testes e na análise pós-disparo). */\nexport function simulateFlight(body: Body, env: SimEnvironment, dt: number = FIXED_DT): Flight {\n  const flight = createFlight(body, env.world);\n  while (!flight.outcome) advanceFlight(flight, env, dt);\n  return flight;\n}\n", "src/core/Terrain.ts": "/**\n * Terreno: uma linha poligonal (lista de pontos ordenados em X).\n * Fornece altura e vetor normal em qualquer posição horizontal.\n */\nimport type { TerrainPoint, Vec2 } from './types';\nimport { normalize, vec } from './vector';\n\n/** Altura do terreno em x, por interpolação linear entre os pontos. */\nexport function heightAt(points: TerrainPoint[], x: number): number {\n  if (points.length === 0) return 0;\n  if (x <= points[0].x) return points[0].y;\n  const last = points[points.length - 1];\n  if (x >= last.x) return last.y;\n  for (let i = 1; i < points.length; i++) {\n    const a = points[i - 1];\n    const b = points[i];\n    if (x <= b.x) {\n      const span = b.x - a.x;\n      if (span <= 0) return Math.max(a.y, b.y);\n      const t = (x - a.x) / span;\n      return a.y + (b.y - a.y) * t;\n    }\n  }\n  return last.y;\n}\n\n/** Inclinação (dy/dx) do terreno em x. */\nexport function slopeAt(points: TerrainPoint[], x: number): number {\n  const h = 0.05;\n  return (heightAt(points, x + h) - heightAt(points, x - h)) / (2 * h);\n}\n\n/** Vetor normal unitário (apontando para fora do solo) em x. */\nexport function normalAt(points: TerrainPoint[], x: number): Vec2 {\n  return normalize(vec(-slopeAt(points, x), 1));\n}\n\n/** Menor altura do terreno (usada para enquadrar a câmera e os limites). */\nexport function minHeight(points: TerrainPoint[]): number {\n  return points.reduce((m, p) => Math.min(m, p.y), Infinity);\n}\n\n/** Valida a definição de um terreno. Retorna a lista de problemas encontrados. */\nexport function validateTerrain(points: TerrainPoint[]): string[] {\n  const errors: string[] = [];\n  if (points.length < 2) errors.push('O terreno precisa de pelo menos 2 pontos.');\n  for (let i = 1; i < points.length; i++) {\n    if (points[i].x < points[i - 1].x) errors.push(`Ponto ${i} do terreno está fora de ordem em X.`);\n  }\n  if (points.some((p) => !Number.isFinite(p.x) || !Number.isFinite(p.y))) {\n    errors.push('O terreno contém coordenadas inválidas.');\n  }\n  return errors;\n}\n", "src/core/TrajectoryCalculator.ts": "/**\n * Previsão de trajetória: roda a MESMA física do jogo \"às escondidas\"\n * até o primeiro impacto, e também oferece as fórmulas analíticas\n * do lançamento oblíquo no vácuo (usadas nos testes e nas explicações).\n */\nimport type { Body, ShotOutcome, SimEnvironment, Vec2 } from './types';\nimport { FIXED_DT } from './PhysicsEngine';\nimport { advanceFlight, createFlight, MAX_FLIGHT_TIME } from './Simulation';\nimport { toRadians } from './vector';\n\nexport interface PredictionOptions {\n  includeWind?: boolean;\n  includeDrag?: boolean;\n  maxTime?: number;\n}\n\nexport interface Prediction {\n  points: Vec2[];\n  flightTime: number;\n  outcome: ShotOutcome | null;\n  landing: Vec2 | null;\n  maxHeight: number;\n  hitsTarget: boolean;\n}\n\nexport function predictTrajectory(body: Body, env: SimEnvironment, options: PredictionOptions = {}): Prediction {\n  const toggles = {\n    ...env.world.toggles,\n    wind: env.world.toggles.wind && options.includeWind !== false,\n    airResistance: env.world.toggles.airResistance && options.includeDrag !== false,\n  };\n  const previewEnv: SimEnvironment = { ...env, world: { ...env.world, toggles } };\n  const maxTime = options.maxTime ?? MAX_FLIGHT_TIME;\n  const flight = createFlight({ ...body }, previewEnv.world);\n\n  while (!flight.outcome && !flight.firstImpact && flight.t < maxTime) {\n    advanceFlight(flight, previewEnv, FIXED_DT);\n  }\n\n  return {\n    points: flight.trail,\n    flightTime: flight.t,\n    outcome: flight.outcome ?? (flight.firstImpact ? 'ground' : null),\n    landing: flight.firstImpact,\n    maxHeight: flight.maxHeight,\n    hitsTarget: flight.outcome === 'hit',\n  };\n}\n\n/** Recorta o início da trajetória (dificuldade: mostrar só parte da previsão). */\nexport function slicePreview(points: Vec2[], fraction: number): Vec2[] {\n  if (fraction >= 1) return points;\n  const count = Math.max(2, Math.ceil(points.length * Math.max(0, fraction)));\n  return points.slice(0, count);\n}\n\n/** Alcance no vácuo, lançado e aterrissando na mesma altura: R = v² · sen(2θ) / g */\nexport function analyticRange(speed: number, angleDeg: number, gravity: number): number {\n  return (speed * speed * Math.sin(2 * toRadians(angleDeg))) / gravity;\n}\n\n/** Tempo de voo no vácuo (mesma altura): T = 2 · v · sen(θ) / g */\nexport function analyticFlightTime(speed: number, angleDeg: number, gravity: number): number {\n  return (2 * speed * Math.sin(toRadians(angleDeg))) / gravity;\n}\n\n/** Altura máxima no vácuo: H = (v · sen θ)² / (2g) */\nexport function analyticMaxHeight(speed: number, angleDeg: number, gravity: number): number {\n  const vy = speed * Math.sin(toRadians(angleDeg));\n  return (vy * vy) / (2 * gravity);\n}\n", "src/core/types.ts": "/**\n * Tipos compartilhados do simulador.\n * Esta camada é \"regra de negócio\": não conhece React, Canvas nem DOM.\n * Unidades: metros (m), segundos (s), quilogramas (kg), newtons (N).\n */\n\n/** Vetor 2D. Eixo X para a direita, eixo Y para cima. */\nexport interface Vec2 {\n  x: number;\n  y: number;\n}\n\nexport type GameMode = 'desafio' | 'aprendizado' | 'laboratorio';\n\nexport type ProjectileKind = 'ferro' | 'pedra' | 'borracha' | 'aerodinamico';\n\nexport interface ProjectileSpec {\n  kind: ProjectileKind;\n  name: string;\n  description: string;\n  defaultMass: number;\n  /** raio em metros */\n  radius: number;\n  /** coeficiente de arrasto (adimensional) */\n  dragCoefficient: number;\n  /** coeficiente de restituição no quique (0 = não quica, 1 = quique perfeito) */\n  restitution: number;\n  color: string;\n}\n\n/** Interruptores do \"Modo laboratório\". */\nexport interface LabToggles {\n  gravity: boolean;\n  wind: boolean;\n  airResistance: boolean;\n  collisions: boolean;\n  recoil: boolean;\n}\n\n/** Condições do ambiente onde o disparo acontece. */\nexport interface WorldSettings {\n  /** aceleração da gravidade em m/s² */\n  gravity: number;\n  /** velocidade do vento em m/s (positivo = para a direita) */\n  windSpeed: number;\n  /** multiplicador da densidade do ar (0 = vácuo) */\n  airDensityFactor: number;\n  toggles: LabToggles;\n}\n\n/** Parâmetros que o jogador escolhe antes do disparo. */\nexport interface LaunchParams {\n  angleDeg: number;\n  /** força média aplicada pela pólvora dentro do cano (N) */\n  force: number;\n  /** massa do projétil (kg) */\n  mass: number;\n  projectile: ProjectileKind;\n  /** massa do canhão (kg) */\n  cannonMass: number;\n}\n\n/** Retângulo com (x, y) no canto inferior esquerdo. */\nexport interface Rect {\n  x: number;\n  y: number;\n  width: number;\n  height: number;\n  label?: string;\n}\n\nexport interface TargetSpec {\n  x: number;\n  y: number;\n  radius: number;\n}\n\nexport interface TerrainPoint {\n  x: number;\n  y: number;\n}\n\n/** Corpo físico simulado (o projétil). */\nexport interface Body {\n  position: Vec2;\n  velocity: Vec2;\n  mass: number;\n  radius: number;\n  dragCoefficient: number;\n  restitution: number;\n}\n\n/** Forças que atuam no corpo em um instante. */\nexport interface ForceBreakdown {\n  gravity: Vec2;\n  wind: Vec2;\n  drag: Vec2;\n  total: Vec2;\n}\n\n/** Amostra para os gráficos de posição, velocidade e aceleração. */\nexport interface SimSample {\n  t: number;\n  x: number;\n  y: number;\n  vx: number;\n  vy: number;\n  ax: number;\n  ay: number;\n}\n\nexport type ShotOutcome = 'hit' | 'ground' | 'obstacle' | 'outOfBounds' | 'timeout';\n\nexport interface Bounds {\n  minX: number;\n  maxX: number;\n  minY: number;\n}\n\n/** Tudo o que a física precisa saber sobre o cenário. */\nexport interface SimEnvironment {\n  world: WorldSettings;\n  terrain: TerrainPoint[];\n  target: TargetSpec;\n  obstacles: Rect[];\n  bounds: Bounds;\n}\n\nexport type CollisionResult =\n  | { type: 'none' }\n  | { type: 'target'; distance: number }\n  | { type: 'obstacle'; index: number }\n  | { type: 'ground'; groundY: number };\n\nexport interface RecoilInfo {\n  /** momento horizontal transferido (kg·m/s) */\n  momentum: number;\n  /** velocidade inicial de recuo do canhão (m/s) */\n  velocity: number;\n  /** distância percorrida até parar por atrito (m) */\n  distance: number;\n}\n\nexport interface LevelControls {\n  angle: boolean;\n  force: boolean;\n  mass: boolean;\n  projectile: boolean;\n  cannonMass: boolean;\n  wind: boolean;\n  airDensity: boolean;\n  gravity: boolean;\n  toggles: boolean;\n}\n\nexport interface LevelDifficulty {\n  /** 0 = ilimitado */\n  maxShots: number;\n  /** fração da trajetória prevista que é exibida (0..1) */\n  previewFraction: number;\n  previewIncludesWind: boolean;\n  previewIncludesDrag: boolean;\n}\n\nexport interface LevelConstraints {\n  maxForce?: number;\n  maxRecoil?: number;\n  distinctMasses?: number;\n}\n\nexport interface LevelConfig {\n  id: number;\n  title: string;\n  subtitle: string;\n  intro: string;\n  newtonFocus: number[];\n  worldWidth: number;\n  terrain: TerrainPoint[];\n  cannonX: number;\n  target: TargetSpec;\n  obstacles: Rect[];\n  wind: { base: number; variation: number };\n  world: { gravity: number; airDensityFactor: number; toggles: LabToggles };\n  defaults: LaunchParams;\n  controls: LevelControls;\n  difficulty: LevelDifficulty;\n  constraints: LevelConstraints;\n  requirements: string[];\n  tips: string[];\n}\n\n/** Registro de um disparo já concluído. */\nexport interface ShotRecord {\n  shotNumber: number;\n  params: LaunchParams;\n  windSpeed: number;\n  outcome: ShotOutcome;\n  launchSpeed: number;\n  flightTime: number;\n  maxHeight: number;\n  impactX: number | null;\n  targetDistance: number | null;\n  closestApproach: number;\n  recoil: RecoilInfo;\n  recoilViolation: boolean;\n  points: number;\n}\n\nexport interface FeedbackItem {\n  law: 1 | 2 | 3 | null;\n  tone: 'info' | 'success' | 'warning';\n  title: string;\n  text: string;\n}\n", "src/core/validation.ts": "/**\n * Validação dos valores dos controles.\n * A interface usa estes limites nos sliders; a física só recebe valores válidos.\n */\nimport type { LaunchParams, LevelConstraints, WorldSettings } from './types';\nimport { isProjectileKind } from './Projectile';\nimport { clamp } from './vector';\n\nexport interface Limit {\n  min: number;\n  max: number;\n  step: number;\n  unit: string;\n  label: string;\n}\n\nexport const LIMITS = {\n  angleDeg: { min: 0, max: 90, step: 1, unit: '°', label: 'Ângulo' },\n  force: { min: 500, max: 12000, step: 100, unit: 'N', label: 'Força do disparo' },\n  mass: { min: 1, max: 10, step: 0.1, unit: 'kg', label: 'Massa do projétil' },\n  cannonMass: { min: 20, max: 2000, step: 10, unit: 'kg', label: 'Massa do canhão' },\n  windSpeed: { min: -15, max: 15, step: 0.5, unit: 'm/s', label: 'Vento' },\n  airDensityFactor: { min: 0, max: 5, step: 0.1, unit: '×', label: 'Resistência do ar' },\n  gravity: { min: 0, max: 30, step: 0.1, unit: 'm/s²', label: 'Gravidade' },\n} satisfies Record<string, Limit>;\n\nexport type LimitKey = keyof typeof LIMITS;\n\n/** Retorna uma mensagem de erro ou null se o valor estiver dentro do limite. */\nexport function validateNumber(key: LimitKey, value: number, maxOverride?: number): string | null {\n  const limit: Limit = LIMITS[key];\n  const max = maxOverride ?? limit.max;\n  if (typeof value !== 'number' || !Number.isFinite(value)) return `${limit.label}: informe um número válido.`;\n  if (value < limit.min) return `${limit.label}: o mínimo é ${limit.min} ${limit.unit}.`;\n  if (value > max) return `${limit.label}: o máximo é ${max} ${limit.unit}.`;\n  return null;\n}\n\nexport function clampToLimit(key: LimitKey, value: number): number {\n  const limit: Limit = LIMITS[key];\n  if (!Number.isFinite(value)) return limit.min;\n  return clamp(value, limit.min, limit.max);\n}\n\nexport interface ValidationResult {\n  valid: boolean;\n  errors: string[];\n}\n\nexport function validateLaunch(params: LaunchParams, constraints: LevelConstraints = {}): ValidationResult {\n  const errors: string[] = [];\n  const push = (e: string | null) => {\n    if (e) errors.push(e);\n  };\n  push(validateNumber('angleDeg', params.angleDeg));\n  push(validateNumber('force', params.force, constraints.maxForce));\n  push(validateNumber('mass', params.mass));\n  push(validateNumber('cannonMass', params.cannonMass));\n  if (!isProjectileKind(params.projectile)) errors.push('Tipo de projétil desconhecido.');\n  return { valid: errors.length === 0, errors };\n}\n\nexport function validateWorld(world: WorldSettings): ValidationResult {\n  const errors: string[] = [];\n  const push = (e: string | null) => {\n    if (e) errors.push(e);\n  };\n  push(validateNumber('gravity', world.gravity));\n  push(validateNumber('windSpeed', world.windSpeed));\n  push(validateNumber('airDensityFactor', world.airDensityFactor));\n  return { valid: errors.length === 0, errors };\n}\n", "src/core/vector.ts": "/**\n * Operações com vetores 2D. Funções puras: nunca alteram os argumentos.\n */\nimport type { Vec2 } from './types';\n\nexport const vec = (x: number, y: number): Vec2 => ({ x, y });\n\nexport const ZERO: Vec2 = Object.freeze({ x: 0, y: 0 });\n\nexport const add = (a: Vec2, b: Vec2): Vec2 => ({ x: a.x + b.x, y: a.y + b.y });\n\nexport const sub = (a: Vec2, b: Vec2): Vec2 => ({ x: a.x - b.x, y: a.y - b.y });\n\nexport const scale = (a: Vec2, k: number): Vec2 => ({ x: a.x * k, y: a.y * k });\n\nexport const dot = (a: Vec2, b: Vec2): number => a.x * b.x + a.y * b.y;\n\nexport const length = (a: Vec2): number => Math.hypot(a.x, a.y);\n\nexport const distance = (a: Vec2, b: Vec2): number => Math.hypot(a.x - b.x, a.y - b.y);\n\n/** Vetor unitário na mesma direção (ou zero, se o vetor for nulo). */\nexport function normalize(a: Vec2): Vec2 {\n  const len = length(a);\n  return len === 0 ? ZERO : { x: a.x / len, y: a.y / len };\n}\n\nexport const toRadians = (deg: number): number => (deg * Math.PI) / 180;\n\nexport const toDegrees = (rad: number): number => (rad * 180) / Math.PI;\n\n/** Cria um vetor a partir de um ângulo (graus, a partir do eixo X) e um módulo. */\nexport function fromAngle(angleDeg: number, magnitude: number): Vec2 {\n  const r = toRadians(angleDeg);\n  return { x: Math.cos(r) * magnitude, y: Math.sin(r) * magnitude };\n}\n\nexport const clamp = (v: number, min: number, max: number): number => Math.min(max, Math.max(min, v));\n", "src/core/WindSystem.ts": "/**\n * Sistema de vento (modelo simplificado para o jogo).\n *\n * O vento empurra o projétil com uma força horizontal proporcional à\n * velocidade do vento e à área do projétil:  F = k · w · (r / r_ref)²\n * Pela 2ª lei (a = F/m), projéteis leves e grandes são mais desviados.\n */\nimport type { Vec2 } from './types';\nimport { vec } from './vector';\n\n/** Constante do modelo: newtons por (m/s) de vento, para o raio de referência. */\nexport const WIND_COEFFICIENT = 0.6;\nexport const REFERENCE_RADIUS = 0.08;\n\nexport function windForce(windSpeed: number, radius: number): Vec2 {\n  const areaFactor = (radius / REFERENCE_RADIUS) ** 2;\n  return vec(WIND_COEFFICIENT * windSpeed * areaFactor, 0);\n}\n\n/** Sorteia o vento do próximo disparo dentro de [base - variação, base + variação]. */\nexport function nextWind(base: number, variation: number, rng: () => number = Math.random): number {\n  const value = base + (rng() * 2 - 1) * variation;\n  return Math.round(value * 2) / 2; // passos de 0,5 m/s\n}\n\nexport function describeWind(speed: number): string {\n  const s = Math.abs(speed);\n  const dir = speed > 0 ? 'a favor (→)' : 'contra (←)';\n  if (s < 0.5) return 'Sem vento';\n  if (s < 4) return `Brisa leve ${dir}`;\n  if (s < 9) return `Vento moderado ${dir}`;\n  return `Vento forte ${dir}`;\n}\n", "src/main.tsx": "/** Ponto de entrada: monta o React na página. */\nimport React from 'react';\nimport { createRoot } from 'react-dom/client';\nimport { App } from './App';\n\nconst container = document.getElementById('root');\nif (!container) throw new Error('Elemento #root não encontrado.');\ncreateRoot(container).render(\n  <React.StrictMode>\n    <App />\n  <\/React.StrictMode>,\n);\n", "src/render/Background.ts": "/** Céu, sol, montanhas, nuvens e bandeiras de vento. */\nimport type { Vec2 } from '../core/types';\nimport { Camera, toScreen } from './Camera';\n\nexport function drawSky(ctx: CanvasRenderingContext2D, cam: Camera): void {\n  const g = ctx.createLinearGradient(0, 0, 0, cam.height);\n  g.addColorStop(0, '#2f80ed');\n  g.addColorStop(0.55, '#74c0fc');\n  g.addColorStop(1, '#d0ebff');\n  ctx.fillStyle = g;\n  ctx.fillRect(0, 0, cam.width, cam.height);\n\n  // sol\n  const sx = cam.width - 90;\n  const sy = 78;\n  const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);\n  glow.addColorStop(0, 'rgba(255, 236, 153, 0.9)');\n  glow.addColorStop(1, 'rgba(255, 236, 153, 0)');\n  ctx.fillStyle = glow;\n  ctx.fillRect(sx - 90, sy - 90, 180, 180);\n  ctx.fillStyle = '#ffe066';\n  ctx.beginPath();\n  ctx.arc(sx, sy, 30, 0, Math.PI * 2);\n  ctx.fill();\n}\n\nfunction mountainLayer(ctx: CanvasRenderingContext2D, cam: Camera, baseY: number, amp: number, freq: number, phase: number, color: string) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  ctx.moveTo(0, cam.height);\n  for (let x = 0; x <= cam.width; x += 10) {\n    const y = baseY - amp * (0.55 + 0.45 * Math.sin(x * freq + phase)) - amp * 0.35 * Math.sin(x * freq * 2.7 + phase * 1.3);\n    ctx.lineTo(x, y);\n  }\n  ctx.lineTo(cam.width, cam.height);\n  ctx.closePath();\n  ctx.fill();\n}\n\nexport function drawMountains(ctx: CanvasRenderingContext2D, cam: Camera): void {\n  const ground = toScreen(cam, { x: 0, y: cam.minY + 3 }).y;\n  mountainLayer(ctx, cam, ground - 40, 150, 0.006, 1.2, 'rgba(116, 143, 252, 0.45)');\n  mountainLayer(ctx, cam, ground - 10, 95, 0.011, 4.1, 'rgba(92, 124, 250, 0.45)');\n}\n\nconst CLOUDS = [\n  { x: 80, y: 70, s: 1.1 },\n  { x: 330, y: 120, s: 0.8 },\n  { x: 560, y: 60, s: 1.3 },\n  { x: 800, y: 150, s: 0.9 },\n  { x: 1050, y: 95, s: 1 },\n];\n\nexport function drawClouds(ctx: CanvasRenderingContext2D, cam: Camera, time: number, windSpeed: number): void {\n  const speed = 6 + windSpeed * 5;\n  const span = cam.width + 300;\n  ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';\n  for (const c of CLOUDS) {\n    const x = ((((c.x + time * speed) % span) + span) % span) - 150;\n    const r = 22 * c.s;\n    ctx.beginPath();\n    ctx.arc(x, c.y, r, 0, Math.PI * 2);\n    ctx.arc(x + r * 1.1, c.y - r * 0.5, r * 1.15, 0, Math.PI * 2);\n    ctx.arc(x + r * 2.3, c.y, r * 0.95, 0, Math.PI * 2);\n    ctx.arc(x + r * 1.2, c.y + r * 0.3, r, 0, Math.PI * 2);\n    ctx.fill();\n  }\n}\n\n/** Bandeira que tremula na direção do vento; o comprimento indica a intensidade. */\nexport function drawWindFlag(ctx: CanvasRenderingContext2D, cam: Camera, base: Vec2, windSpeed: number, time: number): void {\n  const b = toScreen(cam, base);\n  const poleHeight = Math.max(34, 4 * cam.scale);\n  const top = { x: b.x, y: b.y - poleHeight };\n  ctx.strokeStyle = '#495057';\n  ctx.lineWidth = 2.5;\n  ctx.beginPath();\n  ctx.moveTo(b.x, b.y);\n  ctx.lineTo(top.x, top.y);\n  ctx.stroke();\n\n  const strength = Math.min(1, Math.abs(windSpeed) / 15);\n  const dir = windSpeed >= 0 ? 1 : -1;\n  const len = 14 + 34 * strength;\n  const droop = (1 - strength) * 16;\n  const wave = Math.sin(time * (3 + strength * 8)) * (2 + strength * 4);\n  ctx.fillStyle = Math.abs(windSpeed) < 0.5 ? '#adb5bd' : '#fa5252';\n  ctx.beginPath();\n  ctx.moveTo(top.x, top.y);\n  ctx.quadraticCurveTo(top.x + dir * len * 0.5, top.y + wave + droop * 0.4, top.x + dir * len, top.y + 7 + droop);\n  ctx.lineTo(top.x, top.y + 14);\n  ctx.closePath();\n  ctx.fill();\n}\n", "src/render/Camera.ts": "/**\n * Câmera: converte coordenadas do mundo (metros, Y para cima)\n * em coordenadas da tela (pixels, Y para baixo).\n */\nimport type { LevelConfig, Vec2 } from '../core/types';\nimport { minHeight } from '../core/Terrain';\n\nexport const CANVAS_WIDTH = 1000;\nexport const CANVAS_HEIGHT = 560;\n\nexport interface Camera {\n  minX: number;\n  maxX: number;\n  minY: number;\n  maxY: number;\n  /** pixels por metro */\n  scale: number;\n  width: number;\n  height: number;\n}\n\nexport function createCamera(level: LevelConfig): Camera {\n  const minX = -8;\n  const maxX = level.worldWidth + 2;\n  const scale = CANVAS_WIDTH / (maxX - minX);\n  const minY = minHeight(level.terrain) - 3;\n  return { minX, maxX, minY, maxY: minY + CANVAS_HEIGHT / scale, scale, width: CANVAS_WIDTH, height: CANVAS_HEIGHT };\n}\n\nexport function toScreen(cam: Camera, p: Vec2): Vec2 {\n  return { x: (p.x - cam.minX) * cam.scale, y: cam.height - (p.y - cam.minY) * cam.scale };\n}\n\nexport function toWorld(cam: Camera, p: Vec2): Vec2 {\n  return { x: p.x / cam.scale + cam.minX, y: (cam.height - p.y) / cam.scale + cam.minY };\n}\n", "src/render/CannonView.ts": "/** Desenho do canhão (usa a mesma geometria da física em core/Cannon). */\nimport { BARREL_LENGTH, BARREL_WIDTH, muzzlePosition, pivotPosition, WHEEL_RADIUS } from '../core/Cannon';\nimport { toRadians } from '../core/vector';\nimport { Camera, toScreen } from './Camera';\n\nexport interface CannonDrawOptions {\n  baseX: number;\n  groundY: number;\n  angleDeg: number;\n  /** deslocamento para trás causado pelo recuo (m) */\n  recoilOffset: number;\n  /** 0..1 — intensidade do clarão do disparo */\n  flash: number;\n}\n\nexport function drawCannon(ctx: CanvasRenderingContext2D, cam: Camera, o: CannonDrawOptions): void {\n  const s = cam.scale;\n  const pivot = toScreen(cam, pivotPosition(o.baseX, o.groundY, o.recoilOffset));\n  const wheelCenter = toScreen(cam, { x: o.baseX - o.recoilOffset, y: o.groundY + WHEEL_RADIUS });\n\n  // carreta de madeira\n  ctx.fillStyle = '#8d5524';\n  ctx.strokeStyle = '#5c3a17';\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(wheelCenter.x - 1.9 * s, wheelCenter.y + WHEEL_RADIUS * s * 0.9);\n  ctx.lineTo(pivot.x + 0.4 * s, pivot.y - 0.2 * s);\n  ctx.lineTo(pivot.x + 0.9 * s, wheelCenter.y + WHEEL_RADIUS * s * 0.6);\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n\n  // cano\n  ctx.save();\n  ctx.translate(pivot.x, pivot.y);\n  ctx.rotate(-toRadians(o.angleDeg));\n  const len = BARREL_LENGTH * s;\n  const w = BARREL_WIDTH * s;\n  const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);\n  g.addColorStop(0, '#6c757d');\n  g.addColorStop(0.45, '#343a40');\n  g.addColorStop(1, '#16191c');\n  ctx.fillStyle = g;\n  ctx.beginPath();\n  ctx.moveTo(-0.6 * s, -w * 0.62);\n  ctx.lineTo(len, -w * 0.42);\n  ctx.lineTo(len, w * 0.42);\n  ctx.lineTo(-0.6 * s, w * 0.62);\n  ctx.arc(-0.6 * s, 0, w * 0.62, Math.PI / 2, -Math.PI / 2);\n  ctx.closePath();\n  ctx.fill();\n  // anéis\n  ctx.fillStyle = '#212529';\n  ctx.fillRect(len - 0.25 * s, -w * 0.5, 0.25 * s, w);\n  ctx.fillRect(len * 0.45, -w * 0.52, 0.18 * s, w * 1.04);\n  ctx.restore();\n\n  // roda\n  const r = WHEEL_RADIUS * s;\n  ctx.fillStyle = '#6b4423';\n  ctx.strokeStyle = '#3b240f';\n  ctx.lineWidth = Math.max(2, s * 0.18);\n  ctx.beginPath();\n  ctx.arc(wheelCenter.x, wheelCenter.y, r, 0, Math.PI * 2);\n  ctx.fill();\n  ctx.stroke();\n  const spin = -o.recoilOffset / WHEEL_RADIUS;\n  ctx.lineWidth = Math.max(1.2, s * 0.08);\n  for (let i = 0; i < 6; i++) {\n    const a = spin + (i * Math.PI) / 3;\n    ctx.beginPath();\n    ctx.moveTo(wheelCenter.x, wheelCenter.y);\n    ctx.lineTo(wheelCenter.x + Math.cos(a) * r, wheelCenter.y + Math.sin(a) * r);\n    ctx.stroke();\n  }\n  ctx.fillStyle = '#adb5bd';\n  ctx.beginPath();\n  ctx.arc(wheelCenter.x, wheelCenter.y, Math.max(2, r * 0.18), 0, Math.PI * 2);\n  ctx.fill();\n\n  // clarão do disparo\n  if (o.flash > 0) {\n    const m = toScreen(cam, muzzlePosition(o.baseX, o.groundY, o.angleDeg, o.recoilOffset));\n    const size = (18 + 22 * o.flash) * Math.min(1.4, s / 10);\n    const glow = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, size);\n    glow.addColorStop(0, `rgba(255, 244, 179, ${o.flash})`);\n    glow.addColorStop(0.4, `rgba(255, 146, 43, ${o.flash * 0.9})`);\n    glow.addColorStop(1, 'rgba(255, 107, 107, 0)');\n    ctx.fillStyle = glow;\n    ctx.beginPath();\n    ctx.arc(m.x, m.y, size, 0, Math.PI * 2);\n    ctx.fill();\n  }\n}\n", "src/render/Effects.ts": "/** Partículas: fumaça do disparo, poeira, faíscas e confete ao acertar o alvo. */\nimport type { Vec2 } from '../core/types';\nimport { Camera, toScreen } from './Camera';\n\nexport interface Particle {\n  x: number;\n  y: number;\n  vx: number;\n  vy: number;\n  life: number;\n  maxLife: number;\n  color: string;\n  size: number;\n  gravity: number;\n  kind: 'dot' | 'confetti' | 'smoke';\n  spin: number;\n}\n\nexport interface BurstOptions {\n  count: number;\n  speed: number;\n  colors: string[];\n  life: number;\n  size: number;\n  kind?: Particle['kind'];\n  gravity?: number;\n  /** direção central (graus) e abertura (graus) */\n  direction?: number;\n  spread?: number;\n}\n\nexport function spawnBurst(list: Particle[], origin: Vec2, o: BurstOptions): void {\n  for (let i = 0; i < o.count; i++) {\n    const dir = ((o.direction ?? 90) + (Math.random() - 0.5) * (o.spread ?? 360)) * (Math.PI / 180);\n    const speed = o.speed * (0.4 + Math.random() * 0.8);\n    const life = o.life * (0.6 + Math.random() * 0.6);\n    list.push({\n      x: origin.x,\n      y: origin.y,\n      vx: Math.cos(dir) * speed,\n      vy: Math.sin(dir) * speed,\n      life,\n      maxLife: life,\n      color: o.colors[i % o.colors.length],\n      size: o.size * (0.6 + Math.random() * 0.8),\n      gravity: o.gravity ?? 9.81,\n      kind: o.kind ?? 'dot',\n      spin: Math.random() * Math.PI * 2,\n    });\n  }\n}\n\nexport function updateParticles(list: Particle[], dt: number): Particle[] {\n  for (const p of list) {\n    p.vy -= p.gravity * dt;\n    if (p.kind === 'smoke') {\n      p.vx *= 0.97;\n      p.vy *= 0.97;\n    }\n    p.x += p.vx * dt;\n    p.y += p.vy * dt;\n    p.life -= dt;\n    p.spin += dt * 8;\n  }\n  return list.filter((p) => p.life > 0);\n}\n\nexport function drawParticles(ctx: CanvasRenderingContext2D, cam: Camera, list: Particle[]): void {\n  for (const p of list) {\n    const s = toScreen(cam, p);\n    const t = p.life / p.maxLife;\n    ctx.globalAlpha = Math.max(0, Math.min(1, t * 1.4));\n    ctx.fillStyle = p.color;\n    if (p.kind === 'confetti') {\n      ctx.save();\n      ctx.translate(s.x, s.y);\n      ctx.rotate(p.spin);\n      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);\n      ctx.restore();\n    } else {\n      const size = p.kind === 'smoke' ? p.size * (1.8 - t) : p.size;\n      ctx.beginPath();\n      ctx.arc(s.x, s.y, size, 0, Math.PI * 2);\n      ctx.fill();\n    }\n  }\n  ctx.globalAlpha = 1;\n}\n", "src/render/ProjectileView.ts": "/** Projétil, rastro e trajetórias (prevista e comparações). */\nimport type { Body, ProjectileSpec, Vec2 } from '../core/types';\nimport { Camera, toScreen } from './Camera';\n\nexport function drawPath(\n  ctx: CanvasRenderingContext2D,\n  cam: Camera,\n  points: Vec2[],\n  color: string,\n  opts: { width?: number; dash?: number[]; alpha?: number } = {},\n): void {\n  if (points.length < 2) return;\n  ctx.save();\n  ctx.globalAlpha = opts.alpha ?? 1;\n  ctx.strokeStyle = color;\n  ctx.lineWidth = opts.width ?? 2;\n  ctx.lineCap = 'round';\n  ctx.lineJoin = 'round';\n  ctx.setLineDash(opts.dash ?? []);\n  ctx.beginPath();\n  points.forEach((p, i) => {\n    const s = toScreen(cam, p);\n    if (i === 0) ctx.moveTo(s.x, s.y);\n    else ctx.lineTo(s.x, s.y);\n  });\n  ctx.stroke();\n  ctx.restore();\n}\n\n/** Linha pontilhada da trajetória prevista, com marcador de \"fim da
